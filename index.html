<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Where is it?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --grass:#abd87f; --grass-2:#9bcf6c; --road:#e8d9b0; --road-line:#d8c48c;
    --pink:#ff79a8; --pink-d:#e4548a; --sun:#ffd64d; --sun-d:#e9b400; --ink:#3a3340;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ font-family:'Fredoka','Jua',sans-serif; margin:0; color:var(--ink);
        background:#f3efe6; overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
  .kr{ font-family:'Jua',sans-serif; }

  /* ---------- Layout: 3 columns ---------- */
  #stage{ display:flex; flex-direction:row; height:100dvh; width:100vw; }
  .rail{ flex:0 0 21%; min-width:0; display:flex; flex-direction:column; padding:10px 10px; position:relative; }
  #rail-A{ background:linear-gradient(180deg,#ffe9f1,#ffd7e6); border-right:3px solid #ffb6cf; }
  #rail-B{ background:linear-gradient(180deg,#fff8e0,#fff0c2); border-left:3px solid #f3dd8a; }
  #map-wrap{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; padding:10px 6px;
             background:radial-gradient(circle at 50% 0%, #fbf7ee, #efe7d6); }

  /* ---------- Banner ---------- */
  #banner{ flex:0 0 auto; text-align:center; font-family:'Jua',sans-serif; }
  #banner .big{ font-size:1.5rem; color:#3a3340; }
  #banner .big b{ color:var(--sun-d); }
  #banner .small{ font-size:.85rem; color:#9a8f7d; margin-top:-2px; }
  #btn-speak{ display:none; font-size:1.1rem; line-height:1; width:38px; height:38px; border-radius:50%; cursor:pointer;
              background:#fff; border:2px solid #f0e8d6; box-shadow:0 2px 5px rgba(0,0,0,.14); vertical-align:middle; margin-left:8px; }
  #btn-speak:active{ transform:scale(.92); }

  /* ---------- Board ---------- */
  #holder{ flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; padding:6px 0; }
  .board{ width:100%; aspect-ratio:4/3; max-height:100%; position:relative; border-radius:22px; overflow:hidden;
    background:
      radial-gradient(circle at 22% 30%, rgba(255,255,255,.18), transparent 40%),
      repeating-linear-gradient(45deg, var(--grass) 0 22px, var(--grass-2) 22px 44px);
    border:6px solid #7fb755;
    box-shadow:inset 0 0 0 4px rgba(255,255,255,.25), inset 0 0 40px rgba(0,0,0,.10), 0 10px 26px rgba(0,0,0,.14); }
  .h-road,.v-road{ position:absolute; background:var(--road); }
  .h-road{ left:3%; width:94%; height:26px; }
  .v-road{ top:3%; height:94%; width:26px; }
  .h-road::after{ content:""; position:absolute; top:50%; left:0; right:0; border-top:3px dashed var(--road-line); transform:translateY(-50%); }
  .v-road::after{ content:""; position:absolute; left:50%; top:0; bottom:0; border-left:3px dashed var(--road-line); transform:translateX(-50%); }

  .building{ position:absolute; z-index:10; display:flex; flex-direction:column; align-items:center;
             transform:translate(-50%,-60%); pointer-events:none; }
  .building .ico{ font-size:3.3rem; line-height:1; filter:drop-shadow(0 4px 3px rgba(0,0,0,.18)); }
  .building .tag{ margin-top:3px; background:#fff; border:2px solid #efe7d4; color:#5a5360;
                  font-size:13px; font-weight:600; padding:2px 10px; border-radius:999px; white-space:nowrap;
                  box-shadow:0 2px 4px rgba(0,0,0,.10); font-family:'Fredoka',sans-serif; }
  .building.is-target .tag{ background:var(--sun); border-color:var(--sun-d); color:#5a4500; }
  .building.is-target .ico{ filter:drop-shadow(0 0 10px rgba(255,200,0,.9)); }

  .scenery{ position:absolute; z-index:5; transform:translate(-50%,-50%); pointer-events:none;
            filter:drop-shadow(0 3px 2px rgba(0,0,0,.12)); }

  #pin{ position:absolute; z-index:22; font-size:3.2rem; transform:translate(-50%,-120%);
        filter:drop-shadow(0 6px 5px rgba(0,0,0,.3)); animation:bob 1s ease-in-out infinite; display:none; }
  @keyframes bob{ 0%,100%{ transform:translate(-50%,-120%);} 50%{ transform:translate(-50%,-148%);} }

  .char{ position:absolute; z-index:30; width:58px; height:58px; border-radius:50%;
         display:flex; align-items:center; justify-content:center; font-size:1.9rem;
         box-shadow:0 5px 0 rgba(0,0,0,.12), 0 6px 10px rgba(0,0,0,.22);
         transition:left .45s cubic-bezier(.34,1.2,.5,1), top .45s cubic-bezier(.34,1.2,.5,1), transform .35s ease; }
  #char-A{ background:radial-gradient(circle at 35% 30%, #ffd0e2, var(--pink)); border:4px solid #fff; }
  #char-B{ background:radial-gradient(circle at 35% 30%, #fff0b3, var(--sun)); border:4px solid #fff; }
  .char .arrow{ position:absolute; top:-16px; width:0; height:0; border-left:10px solid transparent; border-right:10px solid transparent; }
  #char-A .arrow{ border-bottom:18px solid var(--pink-d); }
  #char-B .arrow{ border-bottom:18px solid var(--sun-d); }
  @keyframes pop{ 0%{transform:scale(1);} 50%{transform:scale(1.4);} 100%{transform:scale(1);} }
  .pop{ animation:pop .5s ease; }

  /* ---------- Hint button ---------- */
  .hint-btn{ font-family:'Jua',sans-serif; width:100%; padding:10px 0; margin-top:10px; border-radius:16px; cursor:pointer;
             background:#fff7c2; color:#8a6a00; border:2px solid #f3dd8a; font-size:1.05rem; box-shadow:0 3px 0 #e2c867; transition:all .12s; }
  .hint-btn:not(:disabled):active{ transform:translateY(2px); box-shadow:none; }
  .hint-btn:disabled{ opacity:.5; cursor:not-allowed; background:#eee9d6; color:#9a937b; box-shadow:none; }

  /* ---------- Practice round / tutorial ---------- */
  .coach{ display:none; margin:0 0 8px; padding:8px 10px; background:#fff; border:3px solid #43c98a; border-radius:14px;
          font-family:'Jua',sans-serif; font-size:.95rem; line-height:1.5; color:#3a3340; box-shadow:0 3px 0 #2da76d;
          max-height:32vh; overflow:auto; }
  .coach .step{ color:#2da76d; font-size:.8rem; }
  .ready-btn.nudge{ outline:3px solid #ffd64d; animation:nudge .5s ease-in-out infinite; }
  #overlay{ position:fixed; inset:0; z-index:200; background:rgba(40,34,50,.55); display:none; align-items:center; justify-content:center; padding:16px; }
  #overlay.show{ display:flex; }
  .ov-card{ background:#fff; border-radius:26px; padding:22px 26px; max-width:620px; width:100%; max-height:92dvh; overflow:auto;
            text-align:center; box-shadow:0 14px 40px rgba(0,0,0,.35); font-family:'Jua',sans-serif; color:#3a3340; }
  .ov-title{ font-size:1.7rem; }
  .ov-body{ font-size:1.15rem; line-height:1.95; margin:14px 0; }
  .ov-dots{ font-size:.85rem; color:#9a8f7d; margin-top:6px; }
  .ov-btns{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .ov-btn{ font-family:'Jua',sans-serif; font-size:1.15rem; padding:12px 22px; border-radius:16px; border:none; cursor:pointer;
           background:#5fce6e; color:#fff; box-shadow:0 4px 0 #3da94c; }
  .ov-btn:active{ transform:translateY(2px); box-shadow:none; }
  .ov-btn.sec{ background:#fff; color:#7a7280; border:2px solid #e5dfd2; box-shadow:0 3px 0 #d9d2c4; }
  .tb{ display:inline-block; padding:3px 12px; border-radius:12px; color:#fff; font-family:'Fredoka',sans-serif; font-weight:600; font-size:1rem; margin:2px; line-height:1.5; }
  .tb.mv{ background:#4b9bff; } .tb.tn{ background:#43c98a; } .tb.bk{ background:#b07cf0; }
  .tb.nm{ background:#fff; color:#3a3340; border:2px solid #e0d8ea; }

  /* ---------- Straight-command guide ---------- */
  .warn{ position:absolute; left:8px; right:8px; top:40%; z-index:40; background:#ff6b8b; color:#fff;
         font-family:'Jua',sans-serif; font-size:.95rem; line-height:1.4; padding:10px 12px; border-radius:14px; text-align:center;
         box-shadow:0 4px 10px rgba(0,0,0,.25); opacity:0; transform:translateY(6px); transition:all .2s; pointer-events:none; }
  .warn.show{ opacity:1; transform:none; }
  .wbtn.nudge{ outline:3px solid #fff; animation:nudge .5s ease-in-out infinite; }
  @keyframes nudge{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.12);} }

  /* ---------- Hint text ---------- */
  .hint-text{ margin-top:8px; padding:7px 9px; background:#fffbe0; border:2px solid #f3dd8a; border-radius:12px;
              font-family:'Jua',sans-serif; font-size:.85rem; line-height:1.55; color:#5a4a00; max-height:28vh; overflow:auto; }
  .hint-text .en{ font-family:'Fredoka',sans-serif; font-size:.72rem; color:#9a8f7d; }

  /* ---------- Live path guide (반투명 경로 가이드) ---------- */
  #guide{ position:absolute; inset:0; width:100%; height:100%; z-index:20; pointer-events:none; }
  #guide-dots{ position:absolute; inset:0; z-index:21; pointer-events:none; }
  .g-dot{ position:absolute; width:12px; height:12px; border-radius:50%; transform:translate(-50%,-50%);
          opacity:.6; border:2px solid #fff; }
  .g-end{ position:absolute; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center;
          font-size:1.3rem; opacity:.55; border:3px dashed #fff; box-shadow:0 3px 6px rgba(0,0,0,.2);
          transition:left .2s, top .2s, transform .2s; }
  .g-end .arrow{ position:absolute; top:-14px; width:0; height:0; border-left:8px solid transparent; border-right:8px solid transparent; }
  .g-A{ background:var(--pink); } .g-B{ background:var(--sun); }
  .g-end.g-A .arrow{ border-bottom:14px solid var(--pink-d); }
  .g-end.g-B .arrow{ border-bottom:14px solid var(--sun-d); }
  .g-x{ position:absolute; transform:translate(-50%,-50%); font-family:'Jua',sans-serif; font-size:1.6rem; color:#d63b3b; opacity:.85;
        text-shadow:0 0 3px #fff, 0 0 3px #fff; }

  #toast{ position:absolute; z-index:55; left:50%; top:50%; transform:translate(-50%,-50%) scale(.8);
          background:rgba(58,51,64,.92); color:#fff; font-family:'Jua',sans-serif; font-size:1.2rem;
          padding:12px 24px; border-radius:18px; opacity:0; transition:all .3s; pointer-events:none; text-align:center; white-space:pre-line; }
  #toast.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }

  /* ---------- Hub (bottom center) ---------- */
  #hub{ flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:14px; padding-top:6px; }
  .score{ display:flex; align-items:center; gap:6px; font-size:1.6rem; font-weight:700; font-family:'Jua',sans-serif; }
  .dot{ width:16px; height:16px; border-radius:50%; box-shadow:0 2px 4px rgba(0,0,0,.2); }
  .dot.A{ background:var(--pink); } .dot.B{ background:var(--sun); }
  #go-block{ display:flex; flex-direction:column; align-items:center; gap:2px; }
  #round-badge{ font-size:.72rem; color:#8a8290; font-weight:600; letter-spacing:.5px; }
  #btn-go{ width:72px; height:72px; border-radius:50%; border:5px solid #fff; color:#fff;
           font-family:'Jua',sans-serif; font-size:1.5rem; cursor:pointer;
           background:radial-gradient(circle at 35% 30%, #ff8a8a, #d63b3b);
           box-shadow:0 8px 0 #a82a2a, 0 12px 18px rgba(0,0,0,.3); transition:all .12s; }
  #btn-go:not(:disabled):active{ transform:translateY(4px); box-shadow:0 4px 0 #a82a2a; }
  #btn-go:disabled{ background:#cfcad4; box-shadow:0 8px 0 #b3aebb; cursor:not-allowed; }
  #btn-go.glow{ animation:glow 1s ease-in-out infinite; }
  @keyframes glow{ 0%,100%{ box-shadow:0 8px 0 #a82a2a, 0 0 0 rgba(255,80,80,.6);} 50%{ box-shadow:0 8px 0 #a82a2a, 0 0 22px 6px rgba(255,80,80,.85);} }
  .mini-btn{ font-family:'Jua',sans-serif; font-size:1rem; font-weight:600; padding:11px 20px;
             border-radius:16px; border:2px solid #e5dfd2; background:#fff; color:#7a7280; cursor:pointer;
             box-shadow:0 3px 0 #d9d2c4; transition:all .12s; }
  .mini-btn:active{ transform:translateY(2px); box-shadow:none; }
  #side-btns{ display:flex; flex-direction:column; gap:8px; }
  /* Next button blinks red when BOTH players have arrived */
  #btn-next.blink{ color:#fff; border-color:#ff3b3b; box-shadow:0 3px 0 #b62525;
                   animation:nextblink .7s ease-in-out infinite; }
  @keyframes nextblink{
    0%,100%{ background:#ff5a5a; box-shadow:0 3px 0 #b62525, 0 0 0 rgba(255,70,70,0); transform:scale(1); }
    50%{ background:#ff2f2f; box-shadow:0 3px 0 #b62525, 0 0 20px 5px rgba(255,60,60,.9); transform:scale(1.1); }
  }

  /* ---------- Rail content ---------- */
  .r-head{ display:flex; flex-direction:column; gap:6px; margin-bottom:8px; }
  .r-title{ font-family:'Jua',sans-serif; font-size:1.2rem; display:flex; align-items:center; gap:6px; margin-bottom:12px; }
  #rail-A .r-title{ color:var(--pink-d); } #rail-B .r-title{ color:var(--sun-d); }
  .ready-btn{ font-family:'Jua',sans-serif; padding:14px 0; width:100%; border-radius:16px; border:none; cursor:pointer;
              background:#dcd6e0; color:#6c6575; font-size:1.2rem; box-shadow:0 4px 0 #c3bcc9; transition:all .12s; margin-top:10px; }
  .ready-btn:active{ transform:translateY(2px); box-shadow:none; }
  .ready-btn.on{ background:#5fce6e; color:#fff; box-shadow:0 3px 0 #3da94c; }

  .words{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:8px; }
  .wbtn{ font-family:'Fredoka',sans-serif; font-weight:600; font-size:1.05rem; color:#fff;
         padding:13px 17px; border-radius:15px; border:none; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.18); transition:transform .1s; }
  .wbtn:active{ transform:translateY(2px); }
  .wbtn:disabled{ opacity:.4; cursor:not-allowed; }
  .w-move{ background:#4b9bff; box-shadow:0 3px 0 #2f78d6; }
  .w-turn{ background:#43c98a; box-shadow:0 3px 0 #2da76d; }
  .w-num{ background:#fff; color:#3a3340; border:2px solid #e0d8ea; box-shadow:0 3px 0 #d4cadf; }
  .w-blk{ background:#b07cf0; box-shadow:0 3px 0 #8c57cf; }

  .sentence{ flex:1 1 auto; min-height:50px; background:rgba(255,255,255,.7); border:2px dashed #d8cfe0;
             border-radius:16px; padding:8px; display:flex; flex-wrap:wrap; align-content:flex-start; gap:6px; overflow:auto; }
  .sentence .ph{ color:#b3a9bd; font-size:.82rem; width:100%; text-align:center; align-self:center; }
  .chip{ display:inline-flex; align-items:center; gap:4px; height:fit-content; background:#fff; border:2px solid #ecd7e6;
         padding:4px 8px; border-radius:10px; font-family:'Fredoka',sans-serif; font-weight:600; font-size:.88rem;
         color:#4d4656; box-shadow:0 2px 3px rgba(0,0,0,.08); }
  .chip .x{ color:#ff7a9a; font-weight:700; cursor:pointer; line-height:1; }
  .clear-link{ font-family:'Fredoka',sans-serif; font-size:.72rem; color:#a99; background:none; border:none; cursor:pointer; align-self:flex-end; margin-bottom:4px; }
</style>
</head>
<body>
<div id="stage">

  <!-- ============ Player A (LEFT) ============ -->
  <div class="rail" id="rail-A">
    <div class="r-title">🎀 Buddy A </div>
    <div class="coach" id="coach-A"></div>
    <div class="words">
      <button class="wbtn w-move" onclick="addWord('A','Go straight')">Go straight</button>
      <button class="wbtn w-turn" onclick="addWord('A','Turn left')">Turn left</button>
      <button class="wbtn w-turn" onclick="addWord('A','Turn right')">Turn right</button>
      <button class="wbtn w-num" onclick="addWord('A','1')">1</button>
      <button class="wbtn w-num" onclick="addWord('A','2')">2</button>
      <button class="wbtn w-num" onclick="addWord('A','3')">3</button>
      <button class="wbtn w-blk" onclick="addWord('A','block')">block</button>
      <button class="wbtn w-blk" onclick="addWord('A','blocks')">blocks</button>
    </div>
    <button class="clear-link" onclick="clearWords('A')">↺ Clear</button>
    <div class="sentence" id="sentence-A"></div>
    <button class="hint-btn" id="hint-A" onclick="useHint('A')">💡 Hint 1/1</button>
    <div class="hint-text" id="hinttext-A" style="display:none"></div>
    <div class="warn" id="warn-A"></div>
    <button class="ready-btn" id="ready-A" onclick="toggleReady('A')">READY</button>
  </div>

  <!-- ============ Map (CENTER) ============ -->
  <div id="map-wrap">
    <div id="banner">
      <div class="big">Where is the <b id="b-name">Library</b>?
        <button id="btn-speak" onclick="speakCurrent()" title="다시 듣기">🔊</button></div>
      <div class="small kr"><span id="b-kr">Library</span> 어디에 있을까요?</div>
    </div>

    <div id="holder">
      <div class="board" id="board">
        <div id="roads"></div>
        <div id="scenery"></div>
        <div id="buildings"></div>
        <svg id="guide" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
        <div id="guide-dots"></div>
        <div id="pin">📍</div>
        <div class="char" id="char-A"><div class="arrow"></div>🎀</div>
        <div class="char" id="char-B"><div class="arrow"></div>🌼</div>
        <div id="toast"></div>
      </div>
    </div>

    <div id="hub">
      <div class="score"><span class="dot A"></span><span id="score-A">0</span></div>
      <div id="go-block">
        <div id="round-badge">ROUND 1</div>
        <button id="btn-go" onclick="playTurn()" disabled>GO!</button>
      </div>
      <div class="score"><span class="dot B"></span><span id="score-B">0</span></div>
      <div id="side-btns">
        <button class="mini-btn" id="btn-next" onclick="nextRound()" style="display:none;" disabled>▶ Next</button>
        <button class="mini-btn" id="btn-reset" onclick="newGame()">⟳ Reset</button>
      </div>
    </div>
  </div>

  <!-- ============ Player B (RIGHT) ============ -->
  <div class="rail" id="rail-B">
    <div class="r-title">🌼 Buddy B </div>
    <div class="coach" id="coach-B"></div>
    <div class="words">
      <button class="wbtn w-move" onclick="addWord('B','Go straight')">Go straight</button>
      <button class="wbtn w-turn" onclick="addWord('B','Turn left')">Turn left</button>
      <button class="wbtn w-turn" onclick="addWord('B','Turn right')">Turn right</button>
      <button class="wbtn w-num" onclick="addWord('B','1')">1</button>
      <button class="wbtn w-num" onclick="addWord('B','2')">2</button>
      <button class="wbtn w-num" onclick="addWord('B','3')">3</button>
      <button class="wbtn w-blk" onclick="addWord('B','block')">block</button>
      <button class="wbtn w-blk" onclick="addWord('B','blocks')">blocks</button>
    </div>
    <button class="clear-link" onclick="clearWords('B')">↺ Clear</button>
    <div class="sentence" id="sentence-B"></div>
    <button class="hint-btn" id="hint-B" onclick="useHint('B')">💡 Hint 1/1</button>
    <div class="hint-text" id="hinttext-B" style="display:none"></div>
    <div class="warn" id="warn-B"></div>
    <button class="ready-btn" id="ready-B" onclick="toggleReady('B')">READY</button>
  </div>
</div>

<div id="overlay"><div class="ov-card" id="ov-card"></div></div>

<script>
/* ===================== Grid & Coordinates ===================== */
const COLS = [12, 30, 48, 66];   // % x  (columns 0~3)
const ROWS = [22, 50, 78];       // % y  (rows 0~2)
const cx = c => COLS[c];
const cy = r => ROWS[r];
const MAXC = 3, MAXR = 2;

const buildings = [
  { id:'restaurant', name:'Restaurant', c:0, r:0, ico:'🍔' },
  { id:'busstop',    name:'Bus stop',   c:1, r:0, ico:'🚏' },
  { id:'restroom',   name:'Restroom',   c:2, r:0, ico:'🚻' },
  { id:'park',       name:'Park',       c:0, r:1, ico:'⛲' },
  { id:'hospital',   name:'Hospital',   c:1, r:1, ico:'🏥' },
  { id:'bank',       name:'Bank',       c:2, r:1, ico:'🏦' },
  { id:'library',    name:'Library',    c:3, r:1, ico:'📚' },
  { id:'school',     name:'School',     c:1, r:2, ico:'🏫' },
  { id:'house',      name:'House',      c:3, r:2, ico:'🏠' },
];
const scenery = [
  {x:88,y:14,e:'🌳'},{x:94,y:40,e:'🌲'},{x:84,y:64,e:'🌳'},
  {x:6,y:90,e:'🌿'},{x:50,y:92,e:'🌳'},{x:92,y:88,e:'🌲'},{x:30,y:90,e:'🌿'},
];

/* ===================== State ===================== */
/* arrived: 이번 라운드에서 목적지에 도착했는지 / home: 이번 라운드 출발 위치 */
const players = {
  A:{ c:0,r:2,dir:90,  words:[], ready:false, score:0, arrived:false, home:{c:0,r:2,dir:90} },   // left/bottom, facing right
  B:{ c:3,r:0,dir:180, words:[], ready:false, score:0, arrived:false, home:{c:3,r:0,dir:180} },  // right/top, facing down
};
const TOTAL = buildings.length;   // 전체 문제 수 = 지도에 표시된 장소 수
let target = null, round = 1, playing = false, roundOver = false, practice = false;
let queue = [];                   // 이번 게임의 출제 순서(장소를 섞어 중복 없이 출제)
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const bothArrived = () => players.A.arrived && players.B.arrived;

/* ===================== Map build ===================== */

  const roads=document.getElementById('roads'); roads.innerHTML='';
  ROWS.forEach(y=>{ const d=document.createElement('div'); d.className='h-road'; d.style.top=`calc(${y}% - 13px)`; roads.appendChild(d); });

/* ===================== Word handling ===================== */
const locked = p => playing || roundOver || players[p].arrived;
/* 회전 명령(Turn left/right) 바로 뒤에 숫자를 누르면 → 'Go straight'를 먼저 누르라고 한글로 안내 */
const warnTimers={};
function clearNudges(p){ document.querySelectorAll(`#rail-${p} .wbtn.nudge`).forEach(b=>b.classList.remove('nudge')); }
/* 숫자를 누른 뒤 block / blocks를 누르지 않았을 때 한글로 안내 */
function guideBlock(p){
  clearNudges(p);
  const box=document.getElementById('warn-'+p), bs=document.querySelectorAll(`#rail-${p} .w-blk`);
  box.textContent="숫자 다음에는 'block' 또는 'blocks' 버튼을 눌러요!";
  box.classList.add('show'); bs.forEach(b=>b.classList.add('nudge'));
  clearTimeout(warnTimers[p]);
  warnTimers[p]=setTimeout(()=>{ box.classList.remove('show'); clearNudges(p); },2800);
}
function guideStraight(p){
  clearNudges(p);
  const box=document.getElementById('warn-'+p), mv=document.querySelector(`#rail-${p} .w-move`);
  box.textContent="앞으로 가려면 먼저 'Go straight' 버튼을 눌러요!";
  box.classList.add('show'); mv.classList.add('nudge');
  clearTimeout(warnTimers[p]);
  warnTimers[p]=setTimeout(()=>{ box.classList.remove('show'); mv.classList.remove('nudge'); },2800);
}
function addWord(p,w){ if(locked(p)) return;
  if(practice){ const st=PRACTICE[p].steps, i=players[p].words.length; if(i>=st.length) return; if(w!==st[i].w){ practiceWrong(p); return; } }
  const ws=players[p].words, last=ws[ws.length-1];
  if(/^[1-3]$/.test(w) && (last==='Turn left'||last==='Turn right')){ guideStraight(p); return; }
  if(/^[1-3]$/.test(last) && w!=='block' && w!=='blocks'){ ws.push(w); renderSentence(p); guideBlock(p); return; }   // 숫자 뒤에 block(s)가 아니라는 경우
  ws.push(w); renderSentence(p); }
function removeWord(p,i){ if(locked(p)) return; if(practice && i!==players[p].words.length-1) return; players[p].words.splice(i,1); renderSentence(p); }
function clearWords(p){ if(locked(p)) return; players[p].words=[]; renderSentence(p); }
function renderSentence(p){
  const ht=document.getElementById('hinttext-'+p);   // 명령어를 고치면 힌트 숨김
  if(ht){ ht.style.display='none'; ht.innerHTML=''; }
    renderGuide(); if(practice) coachUpdate(p);
  const box=document.getElementById('sentence-'+p); box.innerHTML='';
  if(!players[p].words.length){ box.innerHTML='<span class="ph kr">단어를 눌러<br>길을 안내해요…</span>'; return; }
  players[p].words.forEach((w,i)=>{ const s=document.createElement('span'); s.className='chip';
    s.innerHTML=`${w}<span class="x" onclick="removeWord('${p}',${i})">✕</span>`; box.appendChild(s); });
}
function setRailEnabled(p, on){
  document.querySelectorAll(`#rail-${p} .wbtn, #rail-${p} .ready-btn`).forEach(b=>b.disabled=!on);
}

/* ===================== Hint (1판당 1번, 한글로 경로 알려주기) ===================== */
const HINT_MAX = 5;   // 게임 전체에서 플레이어당 쓸 수 있는 힌트 횟수
function updateHintBtn(p){
  const s=players[p], b=document.getElementById('hint-'+p); if(!b) return;
  b.textContent='💡 Hint '+s.hintsLeft+'/'+HINT_MAX;
  b.disabled = !(s.hintsLeft>0) || !!s.arrived || practice;
}
/* 지금까지 고른 명령어대로 움직였을 때의 위치·방향 (가이드의 끝점과 같음) */
function currentState(p){
  const sim=simulate(p), end=sim.pts[sim.pts.length-1];
  return { c:end.c, r:end.r, dir:sim.dir };
}
function stopHint(p){   // 새 문제 시작 시 힌트 내용 지우기
  const box=document.getElementById('hinttext-'+p);
  if(box){ box.style.display='none'; box.innerHTML=''; }
  updateHintBtn(p);
}
/* 출발 위치에서 목적지까지 가는 경로를 명령어 순서로 계산 (가로→세로 / 세로→가로 중 명령이 적은 쪽) */
function routeSteps(p){
  const h=currentState(p), dx=target.c-h.c, dy=target.r-h.r;
  const need={ h: dx>0?90:270, v: dy>0?180:0 };
  const mk=order=>{
    let dir=h.dir; const steps=[];
    for(const k of order){
      const n = k==='h' ? Math.abs(dx) : Math.abs(dy); if(!n) continue;
      const want=need[k], diff=((want-dir)+360)%360;
      if(diff===90)       steps.push({ ko:'오른쪽으로 돌아요', en:'Turn right', w:1 });
      else if(diff===270) steps.push({ ko:'왼쪽으로 돌아요', en:'Turn left', w:1 });
      else if(diff===180) steps.push({ ko:'오른쪽으로 두 번 돌아요', en:'Turn right, Turn right', w:2 });
      dir=want;
      steps.push({ ko:`앞으로 ${n}칸 가요`, en:`Go straight ${n} ${n>1?'blocks':'block'}`, w:1 });
    }
    return steps;
  };
  const a=mk(['h','v']), b=mk(['v','h']), cnt=x=>x.reduce((t,s)=>t+s.w,0);
  return cnt(b)<cnt(a) ? b : a;
}
function useHint(p){
  const s=players[p];
  if(locked(p) || !(s.hintsLeft>0)) return;
  s.hintsLeft--; updateHintBtn(p);
  const box=document.getElementById('hinttext-'+p);
  const first=routeSteps(p)[0];   // 전체 경로가 아니라 바로 다음 한 단계만
  box.innerHTML='<b>💡 힌트</b><br>'+(first ? '다음은 <b>'+first.ko+'</b>' : '목적지에 도착했어요!<br>GO!를 눌러요');
  box.style.display='block';
}

/* ===================== Live path guide ===================== */
/* 선택한 명령어를 출발 위치부터 미리 따라가 보며 경로를 반투명하게 그려줍니다. (run()과 같은 규칙) */
function simulate(p){
  const s=players[p]; let c=s.home.c, r=s.home.r, dir=s.home.dir;
  const cmds=parse(s.words), pts=[{c,r}]; let blocked=false;
  for(const cmd of cmds){
    if(cmd.t==='turn'){ dir+=cmd.v; }
    else{ for(let k=0;k<cmd.v;k++){
      const d=((dir%360)+360)%360; let nc=c, nr=r;
      if(d===0) nr--; else if(d===90) nc++; else if(d===180) nr++; else if(d===270) nc--;
      if(nc<0||nc>MAXC||nr<0||nr>MAXR){ blocked=true; break; }
      c=nc; r=nr; pts.push({c,r});
    } }
  }
  return { pts, dir:((dir%360)+360)%360, blocked, hasCmd:cmds.length>0 };
}
function renderGuide(){
  const svg=document.getElementById('guide'), dots=document.getElementById('guide-dots');
  if(!svg||!dots) return;
  svg.innerHTML=''; dots.innerHTML='';
  if(playing) return;                               // 이동 중에는 가이드 숨김
  const COLOR={ A:'#e4548a', B:'#e9b400' }, OFF={ A:-1.4, B:1.4 };   // 겹치지 않게 살짝 어긋나게
  ['A','B'].forEach(p=>{
    const s=players[p]; if(s.arrived) return;
    const sim=simulate(p); if(!sim.hasCmd) return;
    const o=OFF[p];
    if(sim.pts.length>1){
      const pl=document.createElementNS('http://www.w3.org/2000/svg','polyline');
      pl.setAttribute('points', sim.pts.map(q=>`${cx(q.c)+o},${cy(q.r)+o}`).join(' '));
      pl.setAttribute('fill','none'); pl.setAttribute('stroke',COLOR[p]);
      pl.setAttribute('stroke-width','7'); pl.setAttribute('stroke-opacity','.55');
      pl.setAttribute('stroke-linecap','round'); pl.setAttribute('stroke-linejoin','round');
      pl.setAttribute('vector-effect','non-scaling-stroke');
      svg.appendChild(pl);
      sim.pts.slice(1,-1).forEach(q=>{               // 지나가는 칸 표시
        const d=document.createElement('div'); d.className='g-dot g-'+p;
        d.style.left=(cx(q.c)+o)+'%'; d.style.top=(cy(q.r)+o)+'%'; dots.appendChild(d); });
    }
    const end=sim.pts[sim.pts.length-1];            // 도착 예정 위치 + 바라보는 방향
    const e=document.createElement('div'); e.className='g-end g-'+p;
    e.style.left=(cx(end.c)+o)+'%'; e.style.top=(cy(end.r)+o)+'%';
    e.style.transform=`translate(-50%,-50%) rotate(${sim.dir}deg)`;
    e.innerHTML='<div class="arrow"></div>'+(p==='A'?'🎀':'🌼');
    dots.appendChild(e);
    if(sim.blocked){                                // 지도 밖으로 나가려는 경우
      const x=document.createElement('div'); x.className='g-x'; x.textContent='✕';
      x.style.left=(cx(end.c)+o)+'%'; x.style.top=(cy(end.r)+o)+'%'; dots.appendChild(x); }
  });
}

/* ===================== Ready / Go ===================== */
function toggleReady(p){ if(locked(p)) return;
  if(practice && players[p].words.length<PRACTICE[p].steps.length){ practiceWrong(p); return; }
  const ws=players[p].words; if(!players[p].ready && /^[1-3]$/.test(ws[ws.length-1])) guideBlock(p);   // 숫자로 끝나면 block 안내
  players[p].ready=!players[p].ready;
  document.getElementById('ready-'+p).classList.toggle('on', players[p].ready); refreshGo(); if(practice) coachAll(); }
function refreshGo(){ const go=document.getElementById('btn-go');
  const ok=players.A.ready&&players.B.ready&&!playing&&!roundOver; go.disabled=!ok; go.classList.toggle('glow', ok); }

/* ===================== Positioning ===================== */
function place(p){ const s=players[p], el=document.getElementById('char-'+p);
  el.style.left=cx(s.c)+'%'; el.style.top=cy(s.r)+'%';
  el.style.transform=`translate(-50%,-50%) rotate(${s.dir}deg)`; }
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* 매 라운드 새 출발 위치 고르기 (목적지 칸 제외, 두 말판은 서로 다른 칸) */
function facing(cell){
  const dirs=[];
  if(cell.r>0) dirs.push(0);       // 위로 갈 수 있음
  if(cell.c<MAXC) dirs.push(90);   // 오른쪽
  if(cell.r<MAXR) dirs.push(180);  // 아래
  if(cell.c>0) dirs.push(270);     // 왼쪽
  return dirs[Math.floor(Math.random()*dirs.length)];
}
function pickStarts(t){
  const cells=[];
  for(let c=0;c<=MAXC;c++) for(let r=0;r<=MAXR;r++){
    if(c===t.c && r===t.r) continue;                 // 목적지에서는 출발 X
    cells.push({ c, r, d: Math.abs(c-t.c)+Math.abs(r-t.r) });  // d: 목적지까지 거리
  }
  // 목적지에서 멀리(가능하면 3칸 이상, 안 되면 2칸 이상) 떨어진 칸만 후보로
  let pool = cells.filter(x=>x.d>=3);
  if(pool.length<3) pool = cells.filter(x=>x.d>=2);
  if(pool.length<2) pool = cells.slice();            // 안전장치
  shuffle(pool);
  return { A:{...pool[0], dir:facing(pool[0])}, B:{...pool[1], dir:facing(pool[1])} };
}

/* ===================== Command parser ===================== */
function parse(words){
  const cmds=[];
  for(let i=0;i<words.length;i++){
    if(words[i]==='Go straight'){ let steps=1;
      if(i+1<words.length && !isNaN(parseInt(words[i+1]))){ steps=parseInt(words[i+1]); i++;
        if(i+1<words.length && (words[i+1]==='block'||words[i+1]==='blocks')) i++; }
      cmds.push({t:'move',v:steps}); }
    else if(words[i]==='Turn left'){ cmds.push({t:'turn',v:-90}); }
    else if(words[i]==='Turn right'){ cmds.push({t:'turn',v:90}); }
  }
  return cmds;
}

/* ===================== Run path ===================== */
async function run(p){
  const s=players[p], el=document.getElementById('char-'+p);
  for(const cmd of parse(s.words)){
    if(cmd.t==='turn'){ s.dir+=cmd.v; place(p); await sleep(450); }
    else{ for(let k=0;k<cmd.v;k++){
      let nc=s.c, nr=s.r, d=((s.dir%360)+360)%360;
      if(d===0) nr--; else if(d===90) nc++; else if(d===180) nr++; else if(d===270) nc--;
      if(nc<0||nc>MAXC||nr<0||nr>MAXR){
        el.style.transform=`translate(-50%,-50%) rotate(${s.dir}deg) scale(1.25)`; await sleep(220);
        place(p); await sleep(250); break; }
      s.c=nc; s.r=nr; place(p); await sleep(450);
    } }
  }
}

/* ===================== Turn & scoring ===================== */
async function playTurn(){
  if(playing) return;
  playing=true; roundOver=true; renderGuide();
  const go=document.getElementById('btn-go'); go.disabled=true; go.classList.remove('glow');
  document.querySelectorAll('.wbtn,.ready-btn').forEach(b=>b.disabled=true);

  // 이미 도착한 플레이어는 words가 비어 있어서 그대로 목적지에 머뭅니다.
  await Promise.all([run('A'), run('B')]);

  if(practice){   // 연습 라운드: 점수 없이 도착만 확인
    playing=false;
    const ok=['A','B'].every(p=>players[p].c===target.c && players[p].r===target.r);
    if(ok){
      ['A','B'].forEach(p=>{ players[p].arrived=true; const el=document.getElementById('char-'+p); el.classList.add('pop'); setTimeout(()=>el.classList.remove('pop'),600); });
      coachAll(); setTimeout(practiceDone,1500);
    } else {
      toast('앞, 도착하지 못했어요!\n다시 해 봐요 💪');
      setTimeout(()=>{ startRound(); coachAll(); },1800);
    }
    return;
  }

  // 이번 시도에서 새로 도착한 플레이어만 점수 +1 (라운드당 1점)
  const newly = { A:false, B:false };
  ['A','B'].forEach(p=>{
    if(!players[p].arrived && score(p)){ players[p].arrived=true; players[p].score++; newly[p]=true; }
  });
  document.getElementById('score-A').textContent=players.A.score+' / '+TOTAL;
  document.getElementById('score-B').textContent=players.B.score+' / '+TOTAL;

  playing=false;

  if(bothArrived()){
    // ✅ 두 명 모두 도착 → 그때서야 Next(또는 최종 결과) 가능
    toast('🎉 둘 다 도착!\nGreat job!');
    if(round>=TOTAL){
      const used=(HINT_MAX*2)-players.A.hintsLeft-players.B.hintsLeft;
      setTimeout(()=>toast('🏆 모든 문제를 풀었어요!\n힌트 사용: '+used+'번'), 1700);
      document.getElementById('btn-reset').classList.add('blink');
    } else {
      const next=document.getElementById('btn-next');
      next.disabled=false; next.style.display='block'; next.classList.add('blink');
    }
    return;
  }

  // ❌ 아직 한 명 이상 도착하지 못함 → Next 잠금, 못 도착한 플레이어만 다시 도전
  let msg;
  if(players.A.arrived && !players.B.arrived)      msg='🎀 Buddy A 도착!\n🌼 Buddy B는 다시 도전!\nTry again!';
  else if(players.B.arrived && !players.A.arrived) msg='🌼 Buddy B 도착!\n🎀 Buddy A는 다시 도전!\nTry again!';
  else                                             msg='아직 도착하지 못했어요!\n다시 도전 ✨\nTry again!';
  toast(msg);
  setTimeout(retryRound, 1800);
}

/* 도착 못 한 플레이어를 출발 위치로 되돌리고 다시 입력받기 */
function retryRound(){
  roundOver=false; playing=false;
  ['A','B'].forEach(p=>{
    const s=players[p];
    if(s.arrived){
      // 도착한 플레이어는 목적지에 그대로, 입력 잠금
      s.words=[]; s.ready=true; renderSentence(p); updateHintBtn(p);
      document.getElementById('ready-'+p).classList.add('on');
      setRailEnabled(p,false);
    } else {
      s.c=s.home.c; s.r=s.home.r; s.dir=s.home.dir;
      s.words=[]; s.ready=false; renderSentence(p); place(p);
      document.getElementById('ready-'+p).classList.remove('on');
      setRailEnabled(p,true);
    }
  });
  refreshGo();
}

function score(p){ const s=players[p], win=(s.c===target.c && s.r===target.r);
  if(win){ const el=document.getElementById('char-'+p); el.classList.add('pop'); setTimeout(()=>el.classList.remove('pop'),600); beep(true); }
  return win; }

/* ===================== Round flow ===================== */
function startRound(){
  playing=false; roundOver=false;
  document.getElementById('round-badge').textContent = practice ? '연습 🎓' : 'Q '+round+' / '+TOTAL;
  const next=document.getElementById('btn-next');
  next.style.display='none'; next.classList.remove('blink'); next.disabled=true;   // 도착 전에는 Next 잠금
  document.querySelectorAll('.wbtn,.ready-btn').forEach(b=>b.disabled=false);

  const t = practice ? buildings.find(b=>b.id===PRACTICE.target) : (queue[round-1] || buildings[(round-1) % buildings.length]);
  target=t;
  const starts = practice ? { A:{...PRACTICE.A.start}, B:{...PRACTICE.B.start} } : pickStarts(t);
  ['A','B'].forEach(p=>{ const s=players[p], st=starts[p];
    s.c=st.c; s.r=st.r; s.dir=st.dir;
    s.home={ c:st.c, r:st.r, dir:st.dir };
    s.arrived=false; stopHint(p);   // 힌트 내용만 지움 (남은 횟수는 게임 전체에서 유지)
    s.words=[]; s.ready=false; renderSentence(p); place(p);
    document.getElementById('ready-'+p).classList.remove('on'); });

  buildings.forEach(b=>document.getElementById('bld-'+b.id).classList.toggle('is-target', b.id===t.id));
  const pin=document.getElementById('pin'); pin.style.left=cx(t.c)+'%'; pin.style.top=cy(t.r)+'%'; pin.style.display='block';

  document.getElementById('b-name').textContent=t.name;
  document.getElementById('b-kr').textContent=t.name;
  toast('Where is the '+t.name+'?');
  speakCurrent();
  refreshGo();
}
function nextRound(){
  if(!bothArrived() || playing) return;   // 두 명 모두 도착해야만 다음 문제로
  round++; startRound();
}
function newGame(){ endPracticeUI(); round=1; players.A.score=0; players.B.score=0;
  players.A.hintsLeft=HINT_MAX; players.B.hintsLeft=HINT_MAX;
  queue = shuffle(buildings.slice());
  document.getElementById('score-A').textContent='0 / '+TOTAL;
  document.getElementById('score-B').textContent='0 / '+TOTAL;
  document.getElementById('btn-reset').classList.remove('blink');
  target=null; startRound(); }

/* ===================== Toast & sound ===================== */
let toastTimer;
function toast(text){ const t=document.getElementById('toast'); t.textContent=text; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2400); }
function beep(ok){ return; try{ const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
  const ctx=new C(); const notes=ok?[660,880]:[200];
  notes.forEach((f,i)=>{ const o=ctx.createOscillator(),g=ctx.createGain(); o.connect(g); g.connect(ctx.destination);
    o.type='sine'; o.frequency.value=f; const t0=ctx.currentTime+i*0.14; g.gain.setValueAtTime(.18,t0);
    g.gain.exponentialRampToValueAtTime(.001,t0+.28); o.start(t0); o.stop(t0+.28); }); }catch(e){} }

/* ===================== Speech (원어민 음성으로 질문 읽어주기) ===================== */
let enVoice=null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs=window.speechSynthesis.getVoices()||[]; if(!vs.length) return;
  const has=n=>vs.find(v=>v.name.toLowerCase().includes(n));
  enVoice =
    has('google us english') || has('google uk english') ||
    vs.find(v=>/natural/i.test(v.name) && /^en/i.test(v.lang)) ||   // Microsoft Natural 계열
    has('samantha') || has('aria') || has('jenny') || has('karen') || has('daniel') || has('alex') ||
    vs.find(v=>/en[-_]US/i.test(v.lang) && !/^Microsoft.*Desktop/i.test(v.name)) ||
    vs.find(v=>/^en/i.test(v.lang)) || null;
}
if('speechSynthesis' in window){ pickVoice(); window.speechSynthesis.onvoiceschanged=pickVoice; }

function speak(text){
  return;   // 소리 끈
  try{
    if(!('speechSynthesis' in window)) return;
    if(!enVoice) pickVoice();
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    if(enVoice){ u.voice=enVoice; u.lang=enVoice.lang; } else { u.lang='en-US'; }
    u.rate=0.9; u.pitch=1.0;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function speakCurrent(){ if(target) speak('Where is the '+target.name+'?'); }

/* ===================== Practice round (연습 라운드 튜토리얼) ===================== */
/* 고정 문제: 목적지 = 병원. 한 사람이 양쪽 화면에서 반짝이는 버튼만 따라 누르면 도착합니다. */
const PRACTICE = {

  A:{ start:{c:0,r:2,dir:90}, steps:[
    { w:'Go straight', note:'🎀는 오른쪽을 보고 있어요. 먼저 오른쪽으로 가요.' },
    { w:'1',           note:'1칸만 가요.' },
    { w:'block',       note:'1칸일 때는 block이에요.' },
    { w:'Turn left',   note:'병원은 위쪽에 있어요. 왼쪽으로 돌면 위쪽을 봐요!' },
    { w:'Go straight', note:'이제 병원 쪽으로 가요.' },
    { w:'1',           note:'1칸만 가요.' },
    { w:'block',       note:'1칸이니까 block!' } ] },
  B:{ start:{c:3,r:0,dir:180}, steps:[
    { w:'Go straight', note:'🌼는 아래쪽을 보고 있어요. 먼저 아래로 가요.' },
    { w:'1',           note:'1칸만 가요.' },
    { w:'block',       note:'1칸일 때는 block이에요.' },
    { w:'Turn right',  note:'병원은 왼쪽에 있어요. 🌼가 아래를 보고 있을 때는 오른쪽으로 돌면 화면의 왼쪽을 봐요!' },
    { w:'Go straight', note:'이제 병원 쪽으로 가요.' },
    { w:'2',           note:'병원까지 2칸이에요.' },
    { w:'blocks',      note:'2칸 이상일 때는 blocks! (s가 붙어요)' } ] },
};
const WORD_KO = {
  'Go straight':{ col:'파란',  mean:'앞으로 가요' },
  'Turn left':  { col:'초록',  mean:'왼쪽으로 돌아요' },
  'Turn right': { col:'초록',  mean:'오른쪽으로 돌아요' },
  '1':{ col:'하얀', mean:'1칸' }, '2':{ col:'하얀', mean:'2칸' }, '3':{ col:'하얀', mean:'3칸' },
  'block': { col:'보라', mean:'칸 (1칸일 때)' },
  'blocks':{ col:'보라', mean:'칸 (2칸 이상일 때)' },
};
function coachUpdate(p){
  if(!practice) return;
  const box=document.getElementById('coach-'+p), st=PRACTICE[p].steps, s=players[p], i=s.words.length, n=st.length;
  const other=players[p==='A'?'B':'A'], rd=document.getElementById('ready-'+p);
  clearNudges(p); rd.classList.remove('nudge');
  let html;
  if(s.arrived){ html='🎉 <b>도착했어요!</b>'; }
  else if(playing){ html='🚶 가는 중이에요… 지도를 봐요!'; }
  else if(i<n){
    const x=st[i], k=WORD_KO[x.w];
    html=`<span class="step">${i+1}단계 / ${n}</span><br>👉 ${k.col} <b>'${x.w}'</b> 버튼을 눌러요!<br>뜻: ${k.mean}<br>💬 ${x.note}`;
    [...document.querySelectorAll(`#rail-${p} .wbtn`)].filter(b=>b.textContent.trim()===x.w).forEach(b=>b.classList.add('nudge'));
  }
  else if(!s.ready){ html='👏 <b>잘했어요!</b><br>👉 이제 초록 <b>READY</b> 버튼을 눌러요!'; rd.classList.add('nudge'); }
  else if(!other.ready){ html='⏳ 반대쪽도 READY를 눌러요…'; }
  else { html='🔴 빨간 <b>GO!</b> 버튼을 눌러요!'; }
  box.innerHTML=html; box.style.display='block';
}
function coachAll(){ coachUpdate('A'); coachUpdate('B'); }
function practiceWrong(p){
  const box=document.getElementById('warn-'+p);
  box.textContent='✨ 반짝이는 버튼을 눌러요!'; box.classList.add('show');
  clearTimeout(warnTimers[p]); warnTimers[p]=setTimeout(()=>box.classList.remove('show'),1800);
}
function endPracticeUI(){
  practice=false;
  document.querySelectorAll('.coach').forEach(c=>{ c.style.display='none'; c.innerHTML=''; });
  ['A','B'].forEach(p=>{ clearNudges(p); document.getElementById('ready-'+p).classList.remove('nudge'); });
}
function startPractice(){
  hideOverlay(); practice=true; round=1;
  startRound(); coachAll();
}
function practiceDone(){
  showOverlay({ title:'🎉 연습 성공!',
    body:'🎀와 🌼 모두 병원에 도착했어요! 👏<br>이제 진짜 게임이에요.<br>이번에는 <b>안내 없이</b> 스스로 길을 찾아요.<br>어려우면 <b>💡 힌트</b>(🎀 5번, 🌼 5번)를 써 봐요!',
    buttons:[ { label:'▶ 게임 시작', fn:()=>{ hideOverlay(); newGame(); } },
              { label:'🔁 연습 다시하기', sec:true, fn:startPractice } ] });
}

/* ----- 안내 화면(오버레이) ----- */
function showOverlay(o){
  const card=document.getElementById('ov-card');
  card.innerHTML=`<div class="ov-title">${o.title}</div><div class="ov-body">${o.body}</div><div class="ov-btns"></div>`;
  const bx=card.querySelector('.ov-btns');
  o.buttons.forEach(b=>{ const e=document.createElement('button'); e.className='ov-btn'+(b.sec?' sec':''); e.textContent=b.label; e.onclick=b.fn; bx.appendChild(e); });
  document.getElementById('overlay').classList.add('show');
}
function hideOverlay(){ document.getElementById('overlay').classList.remove('show'); }
const TUT_PAGES = [
  { title:'📍 목적지를 찾아요',
    body:'지도에서 <b>반짝이는 📍 장소</b>가 목적지예요.<br>🎀와 🌼 두 로봇 친구를 길 안내해서 <b>둘 다</b> 목적지에 도착시켜야 해요.<br>동그라미 위의 <b>▲ 화살표</b>는 지금 보고 있는 방향이에요.' },
  { title:'🗣️ 단어 버튼으로 말해요',
    body:'<span class="tb mv">Go straight</span> 앞으로 가요<br><span class="tb tn">Turn left</span> 왼쪽으로 돌아요<br><span class="tb tn">Turn right</span> 오른쪽으로 돌아요<br><span class="tb nm">1</span><span class="tb nm">2</span><span class="tb nm">3</span> 몇 칸 갈까요?<br><span class="tb bk">block</span> 1칸 &nbsp; <span class="tb bk">blocks</span> 2칸 이상' },
  { title:'✍️ 문장처럼 이어서 눌러요',
    body:'<span class="tb mv">Go straight</span> <span class="tb nm">2</span> <span class="tb bk">blocks</span><br>= <b>앞으로 2칸 가요!</b><br>버튼을 누르면 지도에 <b>길이 흐리게</b> 나타나요.<br>화살표 방향을 잘 보고 돌아요.' },
  { title:'🏥 연습 문제',
    body:'오늘 연습 목적지는 <b>병원(Hospital)</b>이에요!<br>화면에 <b>반짝이는 버튼</b>만 누르면 돼요.<br>다 누르면 <b>READY</b>, 그다음 빨간 <b>GO!</b> 를 눌러요.<br>왼쪽 화면은 🎀, 오른쪽 화면은 🌼 차례예요. <b>양쪽 모두</b> 해 주세요.' },
];
function showTutPage(i){
  const pg=TUT_PAGES[i], last=i===TUT_PAGES.length-1, btns=[];
  if(i>0) btns.push({ label:'◀ 이전', sec:true, fn:()=>showTutPage(i-1) });
  btns.push(last ? { label:'🚀 연습 시작!', fn:startPractice } : { label:'다음 ▶', fn:()=>showTutPage(i+1) });
  showOverlay({ title:pg.title, body:pg.body+`<div class="ov-dots">${i+1} / ${TUT_PAGES.length}</div>`, buttons:btns });
}
function showStart(){
  showOverlay({ title:'🎓 Where is it?',
    body:'🎀와 🌼 두 로봇 친구를 목적지로 안내하는 게임이에요.<br>영어 단어도 함께 배워요!<br>먼저 <b>연습 라운드</b>를 해 볼까요?',
    buttons:[ { label:'🎓 연습 라운드 하기', fn:()=>showTutPage(0) },
              { label:'▶ 바로 게임하기', sec:true, fn:hideOverlay } ] });
}

window.addEventListener('load',()=>{ buildMap(); newGame(); showStart(); });
