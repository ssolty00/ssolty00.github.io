<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Where is it?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#4db3e8; --pink-d:#2a86c4; --sun:#ff9db5; --sun-d:#e0607e; --ink:#404040;
    --panel:#c6c6c6; --stone:#8b8b8b; --dirt:#7a5230; --dirt-d:#3b2a18;
    --blue:#3f6fdc; --green:#3fae4a; --red:#c0392b; --gold:#fcee4b;
    --bev-out: inset -4px -4px 0 rgba(0,0,0,.35), inset 4px 4px 0 rgba(255,255,255,.45);
    --bev-in:  inset 4px 4px 0 rgba(0,0,0,.35), inset -4px -4px 0 rgba(255,255,255,.3);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ font-family:'VT323','Jua',monospace; font-size:18px; margin:0; color:var(--ink);
        background:
          conic-gradient(rgba(0,0,0,.18) 25%, transparent 0 50%, rgba(0,0,0,.18) 0 75%, transparent 0) 0 0/24px 24px,
          #5b4128;
        overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
  .kr{ font-family:'Jua',sans-serif; }

  /* ---------- Layout: 3 columns ---------- */
  #stage{ display:flex; flex-direction:row; height:calc(100dvh - 28px); width:100vw; }
  #footer{ position:fixed; left:0; right:0; bottom:0; height:28px; display:flex; align-items:center; justify-content:center;
           background:#2b1f14; border-top:3px solid #000; box-shadow:inset 0 3px 0 rgba(255,255,255,.12);
           font-family:'Jua',sans-serif; font-size:.9rem; color:#fcee4b; text-shadow:2px 2px 0 rgba(0,0,0,.6); letter-spacing:.5px; z-index:5; }
  .rail{ flex:0 0 21%; min-width:0; display:flex; flex-direction:column; padding:10px 10px; position:relative;
         background:var(--panel); box-shadow:var(--bev-out); border:4px solid #000; }
  #rail-A{ border-top:10px solid var(--pink); }
  #rail-B{ border-top:10px solid var(--sun); }
  #map-wrap{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; padding:10px 8px; position:relative;
    background:
      linear-gradient(rgba(255,255,255,.92),rgba(255,255,255,.92)) 6% 3%/112px 24px no-repeat,
      linear-gradient(rgba(255,255,255,.92),rgba(255,255,255,.92)) 10% 6%/72px 16px no-repeat,
      linear-gradient(rgba(255,255,255,.92),rgba(255,255,255,.92)) 88% 4%/128px 24px no-repeat,
      linear-gradient(rgba(255,255,255,.92),rgba(255,255,255,.92)) 82% 7%/72px 16px no-repeat,
      linear-gradient(180deg,#6aa0ff,#b5d3ff 75%,#d8e9ff); }

  /* ---------- Banner (oak sign) ---------- */
  #banner{ flex:0 0 auto; align-self:center; max-width:100%; text-align:center; font-family:'Jua',sans-serif;
           background:repeating-linear-gradient(0deg, rgba(0,0,0,.07) 0 4px, transparent 4px 18px), #b8945f;
           border:4px solid #4a3216; box-shadow:inset 3px 3px 0 rgba(255,255,255,.25), 0 6px 0 rgba(0,0,0,.35);
           padding:6px 24px 8px; position:relative; z-index:2; }
  #banner .big{ font-size:1.45rem; color:#2b1b0a; }
  #banner .big b{ color:#a30000; }
  #banner .small{ font-size:.85rem; color:#4a3216; margin-top:-2px; }
  #btn-speak{ display:none; }

  /* ---------- Board (grass block top) ---------- */
  #holder{ flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; padding:10px 0 12px; position:relative; z-index:1; }
  .board{ width:100%; aspect-ratio:4/3; max-height:100%; position:relative; overflow:hidden;
    background:
      conic-gradient(rgba(0,0,0,.07) 25%, transparent 0 50%, rgba(0,0,0,.07) 0 75%, transparent 0) 0 0/16px 16px,
      conic-gradient(#5e9c3a 25%, #6aab42 0 50%, #5e9c3a 0 75%, #6aab42 0) 0 0/32px 32px;
    border:10px solid var(--dirt);
    box-shadow:inset 0 0 0 4px #5a3a1f, 0 8px 0 var(--dirt-d), 0 18px 24px rgba(0,0,0,.35); }
  .h-road,.v-road{ position:absolute;
    background:conic-gradient(#8f8f8f 25%, #7d7d7d 0 50%, #8f8f8f 0 75%, #7d7d7d 0) 0 0/16px 16px; box-shadow:inset 0 0 0 3px #666; }
  .h-road{ left:3%; width:94%; height:26px; }
  .v-road{ top:3%; height:94%; width:26px; }
  .h-road::after{ content:""; position:absolute; top:50%; left:0; right:0; border-top:4px dashed #5a5a5a; transform:translateY(-50%); }
  .v-road::after{ content:""; position:absolute; left:50%; top:0; bottom:0; border-left:4px dashed #5a5a5a; transform:translateX(-50%); }

  .building{ position:absolute; z-index:10; display:flex; flex-direction:column; align-items:center;
             transform:translate(-50%,-60%); pointer-events:none; }
  .building .ico{ width:4.6rem; line-height:0; filter:drop-shadow(0 6px 0 rgba(0,0,0,.28)); }
  .building .ico svg{ display:block; width:100%; height:auto; image-rendering:pixelated; }
  .building .tag{ margin-top:9px; background:rgba(0,0,0,.65); border:0; color:#fff;
                  font-size:1.15rem; padding:0 8px; white-space:nowrap; font-family:'VT323','Jua',monospace; letter-spacing:.5px; }
  .building.is-target .tag{ background:var(--gold); color:#3b2a18; }
  .building.is-target .ico{ filter:drop-shadow(0 0 3px #fcee4b) drop-shadow(0 0 10px #fcee4b) drop-shadow(0 6px 0 rgba(0,0,0,.28)); }

  .scenery svg{ display:block; width:100%; height:auto; image-rendering:pixelated; }
  .scenery{ position:absolute; line-height:0; z-index:5; transform:translate(-50%,-50%); pointer-events:none;
            filter:drop-shadow(0 4px 0 rgba(0,0,0,.25)); }

  #pin{ position:absolute; z-index:22; width:2.4rem; transform:translate(-50%,-120%);
        filter:drop-shadow(0 6px 0 rgba(0,0,0,.3)); animation:bob 1s steps(4,end) infinite; display:none; line-height:0; }
  #pin svg{ display:block; width:100%; height:auto; image-rendering:pixelated; }
  @keyframes bob{ 0%,100%{ transform:translate(-50%,-120%);} 50%{ transform:translate(-50%,-148%);} }

  .char{ position:absolute; z-index:30; width:56px; height:56px;
         display:flex; align-items:center; justify-content:center; font-size:1.8rem;
         border:4px solid #000; box-shadow:var(--bev-out), 0 7px 0 rgba(0,0,0,.4);
         transition:left .45s cubic-bezier(.34,1.2,.5,1), top .45s cubic-bezier(.34,1.2,.5,1), transform .35s ease; }
  #char-A{ background:var(--pink); }
  #char-B{ background:var(--sun); }
  .char .arrow{ position:absolute; top:-20px; width:0; height:0; border-left:10px solid transparent; border-right:10px solid transparent; }
  #char-A .arrow{ border-bottom:16px solid var(--pink-d); }
  #char-B .arrow{ border-bottom:16px solid var(--sun-d); }
  @keyframes pop{ 0%{transform:scale(1);} 50%{transform:scale(1.4);} 100%{transform:scale(1);} }
  .pop{ animation:pop .5s ease; }

  /* ---------- Pixel faces (Steve / Pig) ---------- */
  .face-ico{ display:inline-block; width:1.6em; height:1.6em; line-height:0; }
  .face-ico svg{ width:100%; height:100%; display:block; image-rendering:pixelated; }
  .r-title .face-ico{ width:34px; height:34px; border:2px solid #000; }
  .char .face-ico, .g-end .face-ico{ width:100%; height:100%; }

  /* ---------- Hint button ---------- */
  .hint-btn{ font-family:'VT323','Jua',monospace; width:100%; padding:6px 0; margin-top:10px; cursor:pointer;
             background:var(--gold); color:#3b2a18; border:3px solid #000; font-size:1.5rem; box-shadow:var(--bev-out); }
  .hint-btn:not(:disabled):active{ box-shadow:var(--bev-in); }
  .hint-btn:disabled{ cursor:not-allowed; background:#7a7a7a; color:#c9c9c9; }

  /* ---------- Practice round / tutorial (tooltip style) ---------- */
  .coach{ display:none; margin:0 0 8px; padding:8px 10px; background:#100010; border:3px solid #3c0f8f; outline:3px solid #100010;
          font-family:'Jua',sans-serif; font-size:.95rem; line-height:1.5; color:#fff; max-height:32vh; overflow:auto; }
  .coach .step{ color:#55ff55; font-size:.85rem; }
  .coach b{ color:#ffff55; }
  .ready-btn.nudge{ outline:4px solid var(--gold); animation:nudge .5s steps(2,end) infinite; }
  #overlay{ position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.62); display:none; align-items:center; justify-content:center; padding:16px; }
  #overlay.show{ display:flex; }
  .ov-card{ background:var(--panel); border:4px solid #000; box-shadow:var(--bev-out), 0 10px 0 rgba(0,0,0,.45); padding:22px 26px; max-width:620px; width:100%; max-height:92dvh; overflow:auto;
            text-align:center; font-family:'Jua',sans-serif; color:#373737; }
  .ov-title{ font-size:1.7rem; color:#2b2b2b; }
  .ov-body{ font-size:1.15rem; line-height:1.95; margin:14px 0; color:#373737; }
  .ov-body b{ color:#a30000; }
  .ov-dots{ font-size:.85rem; color:#555; margin-top:6px; }
  .ov-btns{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .ov-btn{ font-family:'Jua',sans-serif; font-size:1.15rem; padding:10px 22px; border:3px solid #000; cursor:pointer;
           background:var(--green); color:#fff; box-shadow:var(--bev-out); text-shadow:2px 2px 0 rgba(0,0,0,.4); }
  .ov-btn:active{ box-shadow:var(--bev-in); }
  .ov-btn.sec{ background:#8b8b8b; }
  .tb{ display:inline-block; padding:1px 12px; color:#fff; font-family:'VT323','Jua',monospace; font-size:1.35rem; margin:2px; line-height:1.4;
       border:3px solid #000; box-shadow:var(--bev-out); text-shadow:2px 2px 0 rgba(0,0,0,.4); }
  .tb.mv{ background:var(--blue); } .tb.tn{ background:var(--green); } .tb.bk{ background:#8a4fd6; }
  .tb.nm{ background:#a0a0a0; }

  /* ---------- Straight-command guide ---------- */
  .warn{ position:absolute; left:8px; right:8px; top:40%; z-index:40; background:#aa0000; color:#fff;
         font-family:'Jua',sans-serif; font-size:.95rem; line-height:1.4; padding:10px 12px; text-align:center;
         border:4px solid #550000; box-shadow:var(--bev-out), 0 5px 0 rgba(0,0,0,.4); opacity:0; transform:translateY(6px); transition:all .2s; pointer-events:none; }
  .warn.show{ opacity:1; transform:none; }
  .wbtn.nudge{ outline:4px solid var(--gold); animation:nudge .5s steps(2,end) infinite; }
  @keyframes nudge{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.1);} }

  /* ---------- Hint text (tooltip style) ---------- */
  .hint-text{ margin-top:8px; padding:7px 9px; background:#100010; border:3px solid #3c0f8f; outline:3px solid #100010;
              font-family:'VT323','Jua',monospace; font-size:1.45rem; line-height:1.3; color:#ffff55; max-height:28vh; overflow:auto; }
  .hint-text b{ color:#fff; }

  /* ---------- Live path guide ---------- */
  #guide{ position:absolute; inset:0; width:100%; height:100%; z-index:20; pointer-events:none; }
  #guide-dots{ position:absolute; inset:0; z-index:21; pointer-events:none; }
  .g-dot{ position:absolute; width:12px; height:12px; transform:translate(-50%,-50%); opacity:.75; border:2px solid #fff; }
  .g-end{ position:absolute; width:40px; height:40px; display:flex; align-items:center; justify-content:center;
          font-size:1.3rem; opacity:.65; border:3px dashed #fff; box-shadow:0 3px 6px rgba(0,0,0,.25);
          transition:left .2s, top .2s, transform .2s; }
  .g-end .arrow{ position:absolute; top:-14px; width:0; height:0; border-left:8px solid transparent; border-right:8px solid transparent; }
  .g-A{ background:var(--pink); } .g-B{ background:var(--sun); }
  .g-end.g-A .arrow{ border-bottom:14px solid var(--pink-d); }
  .g-end.g-B .arrow{ border-bottom:14px solid var(--sun-d); }
  .g-x{ position:absolute; transform:translate(-50%,-50%); font-family:'Jua',sans-serif; font-size:1.6rem; color:#ff3b30; opacity:.95;
        text-shadow:0 0 3px #fff, 0 0 3px #fff; }
  #toast{ position:absolute; z-index:55; left:50%; top:50%; transform:translate(-50%,-50%) scale(.8);
          background:#100010; color:#fff; font-family:'Jua',sans-serif; font-size:1.2rem; border:4px solid #3c0f8f; outline:3px solid #100010;
          padding:12px 24px; opacity:0; transition:all .3s; pointer-events:none; text-align:center; white-space:pre-line; }
  #toast.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }

  /* ---------- Hub (bottom center) ---------- */
  #hub{ flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:14px; padding-top:6px; position:relative; z-index:2; }
  .score{ display:flex; align-items:center; gap:8px; font-size:1.9rem; font-family:'VT323','Jua',monospace;
          background:#373737; color:#fff; padding:2px 14px; border:3px solid #000; box-shadow:var(--bev-in); }
  .dot{ width:16px; height:16px; border:2px solid #fff; }
  .dot.A{ background:var(--pink); } .dot.B{ background:var(--sun); }
  #go-block{ display:flex; flex-direction:column; align-items:center; gap:4px; }
  #round-badge{ font-size:1.1rem; color:#fff; background:#373737; letter-spacing:.5px; padding:0 10px; border:2px solid #000; }
  #btn-go{ width:88px; height:68px; border:4px solid #000; color:#fff;
           font-family:'VT323','Jua',monospace; font-size:2.2rem; cursor:pointer; text-shadow:2px 2px 0 rgba(0,0,0,.45);
           background:var(--red); box-shadow:var(--bev-out), 0 8px 0 #6b1d14; transition:transform .08s; }
  #btn-go:not(.off):active{ transform:translateY(6px); box-shadow:var(--bev-in), 0 2px 0 #6b1d14; }
  #btn-go.off{ background:#7a7a7a; box-shadow:var(--bev-out), 0 8px 0 #4a4a4a; }
  #btn-go.glow{ animation:glow 1s steps(2,end) infinite; }
  @keyframes glow{ 0%,100%{ box-shadow:var(--bev-out), 0 8px 0 #6b1d14, 0 0 0 rgba(255,80,80,.6);} 50%{ box-shadow:var(--bev-out), 0 8px 0 #6b1d14, 0 0 22px 6px rgba(255,80,80,.85);} }
  .mini-btn{ font-family:'VT323','Jua',monospace; font-size:1.5rem; padding:2px 18px;
             border:3px solid #000; background:#8b8b8b; color:#fff; cursor:pointer; text-shadow:2px 2px 0 rgba(0,0,0,.4);
             box-shadow:var(--bev-out); }
  .mini-btn:active{ box-shadow:var(--bev-in); }
  #side-btns{ display:flex; flex-direction:column; align-items:center; gap:10px; }
  #btn-next{ background:var(--green); }
  /* Next / Reset button blinks when needed */
  #btn-next.blink{ color:#fff; animation:nextblink .7s steps(2,end) infinite; }
  @keyframes nextblink{
    0%,100%{ background:#ff5a5a; transform:scale(1); }
    50%{ background:#ff2f2f; transform:scale(1.1); }
  }

  /* ---------- Rail content ---------- */
  .r-head{ display:flex; flex-direction:column; gap:6px; margin-bottom:8px; }
  .r-title{ font-family:'VT323','Jua',monospace; font-size:1.7rem; display:flex; align-items:center; gap:6px; margin-bottom:10px; color:#373737; }
  .ready-btn{ font-family:'VT323','Jua',monospace; padding:4px 0; width:100%; border:3px solid #000; cursor:pointer;
              background:#8b8b8b; color:#fff; font-size:1.7rem; box-shadow:var(--bev-out); margin-top:10px; text-shadow:2px 2px 0 rgba(0,0,0,.4); }
  .ready-btn:active{ box-shadow:var(--bev-in); }
  .ready-btn.on{ background:var(--green); }

  .words{ display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin-bottom:8px; }
  .wbtn{ font-family:'VT323','Jua',monospace; font-size:1.45rem; color:#fff; line-height:1.1;
         padding:7px 12px; border:3px solid #000; cursor:pointer; box-shadow:var(--bev-out); text-shadow:2px 2px 0 rgba(0,0,0,.4); }
  .wbtn:active{ box-shadow:var(--bev-in) !important; }
  .wbtn:disabled{ opacity:.45; cursor:not-allowed; }
  .w-move{ background:var(--blue); }
  .w-turn{ background:var(--green); }
  .w-num{ background:#a0a0a0; }
  .w-blk{ background:#8a4fd6; }

  .sentence{ flex:1 1 auto; min-height:50px; background:var(--stone); border:3px solid #000; box-shadow:inset 3px 3px 0 #373737, inset -3px -3px 0 #fff;
             padding:8px; display:flex; flex-wrap:wrap; align-content:flex-start; gap:6px; overflow:auto; }
  .sentence .ph{ color:#3a3a3a; font-size:.85rem; width:100%; text-align:center; align-self:center; }
  .chip{ display:inline-flex; align-items:center; gap:4px; height:fit-content; background:var(--panel); border:2px solid #000;
         padding:0 8px; font-family:'VT323','Jua',monospace; font-size:1.3rem; color:#2b2b2b; box-shadow:var(--bev-out); }
  .chip .x{ color:#b00000; cursor:pointer; line-height:1; }
  .clear-link{ font-family:'VT323','Jua',monospace; font-size:1.45rem; line-height:1.1; color:#fff; background:#8b8b8b; border:3px solid #000;
               padding:3px 12px; cursor:pointer; align-self:flex-end; margin-bottom:6px; box-shadow:var(--bev-out); text-shadow:2px 2px 0 rgba(0,0,0,.4); }
  .clear-link .kr{ font-size:.85rem; text-shadow:none; color:#f0f0f0; }
  .clear-link:active{ box-shadow:var(--bev-in); }
</style>
</head>
<body>
<div id="stage">

  <!-- ============ Player A (LEFT) ============ -->
  <div class="rail" id="rail-A">
    <div class="r-title"><span class="face-ico" data-face="A"></span> Steve <span class="kr" style="font-size:.9rem">스티브</span></div>
    <div class="coach" id="coach-A"></div>
    <div class="words">
      <button class="wbtn w-move" onclick="addWord('A','Go straight')">Go straight</button>
      <button class="wbtn w-turn" onclick="addWord('A','Turn left')">Turn left</button>
      <button class="wbtn w-turn" onclick="addWord('A','Turn right')">Turn right</button>
      <button class="wbtn w-num" onclick="addWord('A','1')">1</button>
      <button class="wbtn w-num" onclick="addWord('A','2')">2</button>
      <button class="wbtn w-num" onclick="addWord('A','3')">3</button>
      <button class="wbtn w-blk" onclick="addWord('A','block')">block</button>
      <button class="wbtn w-blk" onclick="addWord('A','blocks')">blocks</button>
    </div>
    <button class="clear-link" onclick="clearWords('A')">↺ Clear <span class="kr">초기화</span></button>
    <div class="sentence" id="sentence-A"></div>
    <button class="hint-btn" id="hint-A" onclick="useHint('A')">💡 Hint 1/1</button>
    <div class="hint-text" id="hinttext-A" style="display:none"></div>
    <div class="warn" id="warn-A"></div>
    <button class="ready-btn" id="ready-A" onclick="toggleReady('A')">READY</button>
  </div>

  <!-- ============ Map (CENTER) ============ -->
  <div id="map-wrap">
    <div id="banner">
      <div class="big">Where is the <b id="b-name">Library</b>?
        <button id="btn-speak" onclick="speakCurrent()" title="다시 듣기">🔊</button></div>
      <div class="small kr"><span id="b-kr">Library</span> 어디에 있을까요?</div>
    </div>

    <div id="holder">
      <div class="board" id="board">
        <div id="roads"></div>
        <div id="scenery"></div>
        <div id="buildings"></div>
        <svg id="guide" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
        <div id="guide-dots"></div>
        <div id="pin"></div>
        <div class="char" id="char-A"><div class="arrow"></div><span class="face-ico" data-face="A"></span></div>
        <div class="char" id="char-B"><div class="arrow"></div><span class="face-ico" data-face="B"></span></div>
        <div id="toast"></div>
      </div>
    </div>

    <div id="hub">
      <div class="score"><span class="dot A"></span><span id="score-A">0</span></div>
      <div id="go-block">
        <div id="round-badge">ROUND 1</div>
        <button id="btn-go" class="off" onclick="playTurn()">GO!</button>
      </div>
      <div class="score"><span class="dot B"></span><span id="score-B">0</span></div>
      <div id="side-btns">
        <button class="mini-btn" id="btn-next" onclick="nextRound()" style="display:none;" disabled>▶ Next</button>
      </div>
    </div>
  </div>

  <!-- ============ Player B (RIGHT) ============ -->
  <div class="rail" id="rail-B">
    <div class="r-title"><span class="face-ico" data-face="B"></span> Pig <span class="kr" style="font-size:.9rem">돼지</span></div>
    <div class="coach" id="coach-B"></div>
    <div class="words">
      <button class="wbtn w-move" onclick="addWord('B','Go straight')">Go straight</button>
      <button class="wbtn w-turn" onclick="addWord('B','Turn left')">Turn left</button>
      <button class="wbtn w-turn" onclick="addWord('B','Turn right')">Turn right</button>
      <button class="wbtn w-num" onclick="addWord('B','1')">1</button>
      <button class="wbtn w-num" onclick="addWord('B','2')">2</button>
      <button class="wbtn w-num" onclick="addWord('B','3')">3</button>
      <button class="wbtn w-blk" onclick="addWord('B','block')">block</button>
      <button class="wbtn w-blk" onclick="addWord('B','blocks')">blocks</button>
    </div>
    <button class="clear-link" onclick="clearWords('B')">↺ Clear <span class="kr">초기화</span></button>
    <div class="sentence" id="sentence-B"></div>
    <button class="hint-btn" id="hint-B" onclick="useHint('B')">💡 Hint 1/1</button>
    <div class="hint-text" id="hinttext-B" style="display:none"></div>
    <div class="warn" id="warn-B"></div>
    <button class="ready-btn" id="ready-B" onclick="toggleReady('B')">READY</button>
  </div>
</div>

<div id="footer">율빛초 5학년 사랑해 - 인혜쌤</div>

<div id="overlay"><div class="ov-card" id="ov-card"></div></div>

<script>
/* ===================== Grid & Coordinates ===================== */
const COLS = [12, 30, 48, 66];   // % x  (columns 0~3)
const ROWS = [22, 50, 78];       // % y  (rows 0~2)
const cx = c => COLS[c];
const cy = r => ROWS[r];
const MAXC = 3, MAXR = 2;

const buildings = [
  { id:'restaurant', name:'Restaurant', c:0, r:0, ico:'🍔' },
  { id:'busstop',    name:'Bus stop',   c:1, r:0, ico:'🚏' },
  { id:'restroom',   name:'Restroom',   c:2, r:0, ico:'🚻' },
  { id:'park',       name:'Park',       c:0, r:1, ico:'⛲' },
  { id:'hospital',   name:'Hospital',   c:1, r:1, ico:'🏥' },
  { id:'bank',       name:'Bank',       c:2, r:1, ico:'🏦' },
  { id:'library',    name:'Library',    c:3, r:1, ico:'📚' },
  { id:'school',     name:'School',     c:1, r:2, ico:'🏫' },
  { id:'house',      name:'House',      c:3, r:2, ico:'🏠' },
];
const scenery = [
  {x:88,y:14,e:'🌳'},{x:94,y:40,e:'🌲'},{x:84,y:64,e:'🌳'},
  {x:6,y:90,e:'🌿'},{x:50,y:92,e:'🌳'},{x:92,y:88,e:'🌲'},{x:30,y:90,e:'🌿'},
];

/* ===================== State ===================== */
/* arrived: 이번 라운드에서 목적지에 도착했는지 / home: 이번 라운드 출발 위치 */
const players = {
  A:{ c:0,r:2,dir:90,  words:[], ready:false, score:0, arrived:false, home:{c:0,r:2,dir:90} },   // left/bottom, facing right
  B:{ c:3,r:0,dir:180, words:[], ready:false, score:0, arrived:false, home:{c:3,r:0,dir:180} },  // right/top, facing down
};
const TOTAL = buildings.length;   // 전체 문제 수 = 지도에 표시된 장소 수
let target = null, round = 1, playing = false, roundOver = false, practice = false;
let queue = [];                   // 이번 게임의 출제 순서(장소를 섞어 중복 없이 출제)
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const bothArrived = () => players.A.arrived && players.B.arrived;

/* ===================== Map build ===================== */
function buildMap(){
  const roads=document.getElementById('roads'); roads.innerHTML='';
  ROWS.forEach(y=>{ const d=document.createElement('div'); d.className='h-road'; d.style.top=`calc(${y}% - 13px)`; roads.appendChild(d); });
  COLS.forEach(x=>{ const d=document.createElement('div'); d.className='v-road'; d.style.left=`calc(${x}% - 13px)`; roads.appendChild(d); });

  const sc=document.getElementById('scenery'); sc.innerHTML='';
  scenery.forEach(s=>{ const e=document.createElement('div'); e.className='scenery'; e.style.left=s.x+'%'; e.style.top=s.y+'%'; e.style.width=SCENERY_W[s.e]; e.innerHTML=spriteSvg(SPRITES[SCENERY_KIND[s.e]]); sc.appendChild(e); });

  const bc=document.getElementById('buildings'); bc.innerHTML='';
  buildings.forEach(b=>{ const e=document.createElement('div'); e.className='building'; e.id='bld-'+b.id;
    e.style.left=cx(b.c)+'%'; e.style.top=cy(b.r)+'%';
    e.innerHTML=`<div class="ico">${spriteSvg(SPRITES[b.id])}</div><div class="tag">${b.name}</div>`; bc.appendChild(e); });
}

/* ===================== Word handling ===================== */
const locked = p => playing || roundOver || players[p].arrived;
/* 회전 명령(Turn left/right) 바로 뒤에 숫자를 누르면 → 'Go straight'를 먼저 누르라고 한글로 안내 */
const warnTimers={};
function clearNudges(p){ document.querySelectorAll(`#rail-${p} .wbtn.nudge`).forEach(b=>b.classList.remove('nudge')); }
/* 숫자를 누른 뒤 block / blocks를 누르지 않았을 때 한글로 안내 */
function guideBlock(p){
  clearNudges(p);
  const box=document.getElementById('warn-'+p), bs=document.querySelectorAll(`#rail-${p} .w-blk`);
  box.textContent="숫자 다음에는 'block' 또는 'blocks' 버튼을 눌러요!";
  box.classList.add('show'); bs.forEach(b=>b.classList.add('nudge'));
  clearTimeout(warnTimers[p]);
  warnTimers[p]=setTimeout(()=>{ box.classList.remove('show'); clearNudges(p); },2800);
}
/* 'Go straight' 다음에 숫자를 누르지 않았을 때 */
function guideNumber(p){
  clearNudges(p);
  const box=document.getElementById('warn-'+p), ns=document.querySelectorAll(`#rail-${p} .w-num`);
  box.textContent="'Go straight' 다음에는 숫자 버튼(1, 2, 3)을 눌러요!";
  box.classList.add('show'); ns.forEach(b=>b.classList.add('nudge'));
  clearTimeout(warnTimers[p]);
  warnTimers[p]=setTimeout(()=>{ box.classList.remove('show'); clearNudges(p); },2800);
}
function guideStraight(p){
  clearNudges(p);
  const box=document.getElementById('warn-'+p), mv=document.querySelector(`#rail-${p} .w-move`);
  box.textContent="앞으로 가려면 먼저 'Go straight' 버튼을 눌러요!";
  box.classList.add('show'); mv.classList.add('nudge');
  clearTimeout(warnTimers[p]);
  warnTimers[p]=setTimeout(()=>{ box.classList.remove('show'); mv.classList.remove('nudge'); },2800);
}
function addWord(p,w){ if(locked(p)) return;
  if(practice){ const st=PRACTICE[p].steps, i=players[p].words.length; if(i>=st.length) return; if(w!==st[i].w){ practiceWrong(p); return; } }
  const ws=players[p].words, last=ws[ws.length-1];
  if(/^[1-3]$/.test(w) && (last==='Turn left'||last==='Turn right')){ guideStraight(p); return; }
  if(/^[1-3]$/.test(last) && w!=='block' && w!=='blocks'){ ws.push(w); renderSentence(p); guideBlock(p); return; }   // 숫자 뒤에 block(s)가 아니라는 경우
  if(last==='Go straight' && !/^[1-3]$/.test(w)){ ws.push(w); renderSentence(p); guideNumber(p); return; }   // Go straight 뒤에 숫자가 아닌 경우
  ws.push(w); renderSentence(p); }
function removeWord(p,i){ if(locked(p)) return; if(practice && i!==players[p].words.length-1) return; players[p].words.splice(i,1); renderSentence(p); }
function clearWords(p){ if(locked(p)) return; players[p].words=[]; renderSentence(p); }
function renderSentence(p){
  const ht=document.getElementById('hinttext-'+p);   // 명령어를 고치면 힌트 숨김
  if(ht){ ht.style.display='none'; ht.innerHTML=''; }
    renderGuide(); if(practice) coachUpdate(p);
  const box=document.getElementById('sentence-'+p); box.innerHTML='';
  if(!players[p].words.length){ box.innerHTML='<span class="ph kr">단어를 눌러<br>길을 안내해요…</span>'; return; }
  players[p].words.forEach((w,i)=>{ const s=document.createElement('span'); s.className='chip';
    s.innerHTML=`${w}<span class="x" onclick="removeWord('${p}',${i})">✕</span>`; box.appendChild(s); });
}
function setRailEnabled(p, on){
  document.querySelectorAll(`#rail-${p} .wbtn, #rail-${p} .ready-btn`).forEach(b=>b.disabled=!on);
}

/* ===================== Hint (1판당 1번, 한글로 경로 알려주기) ===================== */
const HINT_MAX = 5;   // 게임 전체에서 플레이어당 쓸 수 있는 힌트 횟수
function updateHintBtn(p){
  const s=players[p], b=document.getElementById('hint-'+p); if(!b) return;
  b.textContent='💡 Hint '+s.hintsLeft+'/'+HINT_MAX;
  b.disabled = !(s.hintsLeft>0) || !!s.arrived || practice;
}
/* 지금까지 고른 명령어대로 움직였을 때의 위치·방향 (가이드의 끝점과 같음) */
function currentState(p){
  const sim=simulate(p), end=sim.pts[sim.pts.length-1];
  return { c:end.c, r:end.r, dir:sim.dir };
}
function stopHint(p){   // 새 문제 시작 시 힌트 내용 지우기
  const box=document.getElementById('hinttext-'+p);
  if(box){ box.style.display='none'; box.innerHTML=''; }
  updateHintBtn(p);
}
/* 출발 위치에서 목적지까지 가는 경로를 명령어 순서로 계산 (가로→세로 / 세로→가로 중 명령이 적은 쪽) */
function routeSteps(p){
  const h=currentState(p), dx=target.c-h.c, dy=target.r-h.r;
  const need={ h: dx>0?90:270, v: dy>0?180:0 };
  const mk=order=>{
    let dir=h.dir; const steps=[];
    for(const k of order){
      const n = k==='h' ? Math.abs(dx) : Math.abs(dy); if(!n) continue;
      const want=need[k], diff=((want-dir)+360)%360;
      if(diff===90)       steps.push({ ko:'오른쪽으로 돌아요', en:'Turn right', w:1 });
      else if(diff===270) steps.push({ ko:'왼쪽으로 돌아요', en:'Turn left', w:1 });
      else if(diff===180) steps.push({ ko:'오른쪽으로 두 번 돌아요', en:'Turn right, Turn right', w:2 });
      dir=want;
      steps.push({ ko:`앞으로 ${n}칸 가요`, en:`Go straight ${n} ${n>1?'blocks':'block'}`, w:1 });
    }
    return steps;
  };
  const a=mk(['h','v']), b=mk(['v','h']), cnt=x=>x.reduce((t,s)=>t+s.w,0);
  return cnt(b)<cnt(a) ? b : a;
}
function useHint(p){
  const s=players[p];
  if(locked(p) || !(s.hintsLeft>0)) return;
  s.hintsLeft--; updateHintBtn(p);
  const box=document.getElementById('hinttext-'+p);
  const first=routeSteps(p)[0];   // 전체 경로가 아니라 바로 다음 한 단계만
  box.innerHTML='<b>💡 Hint</b><br>'+(first ? 'Next: <b>'+first.en+'</b>' : 'You are there! 🎉<br>Press READY, then GO!');
  box.style.display='block';
}

/* ===================== Live path guide ===================== */
/* 선택한 명령어를 출발 위치부터 미리 따라가 보며 경로를 반투명하게 그려줍니다. (run()과 같은 규칙) */
function simulate(p){
  const s=players[p]; let c=s.home.c, r=s.home.r, dir=s.home.dir;
  const cmds=parse(s.words, true), pts=[{c,r}]; let blocked=false;
  for(const cmd of cmds){
    if(cmd.t==='turn'){ dir+=cmd.v; }
    else{ for(let k=0;k<cmd.v;k++){
      const d=((dir%360)+360)%360; let nc=c, nr=r;
      if(d===0) nr--; else if(d===90) nc++; else if(d===180) nr++; else if(d===270) nc--;
      if(nc<0||nc>MAXC||nr<0||nr>MAXR){ blocked=true; break; }
      c=nc; r=nr; pts.push({c,r});
    } }
  }
  return { pts, dir:((dir%360)+360)%360, blocked, hasCmd:cmds.length>0 };
}
function renderGuide(){
  const svg=document.getElementById('guide'), dots=document.getElementById('guide-dots');
  if(!svg||!dots) return;
  svg.innerHTML=''; dots.innerHTML='';
  if(playing) return;                               // 이동 중에는 가이드 숨김
  const COLOR={ A:'#2a86c4', B:'#e0607e' }, OFF={ A:-1.4, B:1.4 };   // 겹치지 않게 살짝 어긋나게
  ['A','B'].forEach(p=>{
    const s=players[p]; if(s.arrived) return;
    const sim=simulate(p); if(!sim.hasCmd) return;
    const o=OFF[p];
    if(sim.pts.length>1){
      const pl=document.createElementNS('http://www.w3.org/2000/svg','polyline');
      pl.setAttribute('points', sim.pts.map(q=>`${cx(q.c)+o},${cy(q.r)+o}`).join(' '));
      pl.setAttribute('fill','none'); pl.setAttribute('stroke',COLOR[p]);
      pl.setAttribute('stroke-width','7'); pl.setAttribute('stroke-opacity','.55');
      pl.setAttribute('stroke-linecap','round'); pl.setAttribute('stroke-linejoin','round');
      pl.setAttribute('vector-effect','non-scaling-stroke');
      svg.appendChild(pl);
      sim.pts.slice(1,-1).forEach(q=>{               // 지나가는 칸 표시
        const d=document.createElement('div'); d.className='g-dot g-'+p;
        d.style.left=(cx(q.c)+o)+'%'; d.style.top=(cy(q.r)+o)+'%'; dots.appendChild(d); });
    }
    const end=sim.pts[sim.pts.length-1];            // 도착 예정 위치 + 바라보는 방향
    const e=document.createElement('div'); e.className='g-end g-'+p;
    e.style.left=(cx(end.c)+o)+'%'; e.style.top=(cy(end.r)+o)+'%';
    e.style.transform=`translate(-50%,-50%) rotate(${sim.dir}deg)`;
    e.innerHTML='<div class="arrow"></div>'+faceSvg(p);
    dots.appendChild(e);
    if(sim.blocked){                                // 지도 밖으로 나가려는 경우
      const x=document.createElement('div'); x.className='g-x'; x.textContent='✕';
      x.style.left=(cx(end.c)+o)+'%'; x.style.top=(cy(end.r)+o)+'%'; dots.appendChild(x); }
  });
}

/* ===================== Ready / Go ===================== */
function toggleReady(p){ if(locked(p)) return;
  if(practice && players[p].words.length<PRACTICE[p].steps.length){ practiceWrong(p); return; }
  const ws=players[p].words; if(!players[p].ready && /^[1-3]$/.test(ws[ws.length-1])) guideBlock(p);   // 숫자로 끝나면 block 안내
  if(!players[p].ready && ws[ws.length-1]==='Go straight') guideNumber(p);   // Go straight로 끝나면 숫자 안내
  players[p].ready=!players[p].ready;
  document.getElementById('ready-'+p).classList.toggle('on', players[p].ready); refreshGo(); if(practice) coachAll(); }
function refreshGo(){ const go=document.getElementById('btn-go');
  const ok=players.A.ready&&players.B.ready&&!playing&&!roundOver; go.classList.toggle('off', !ok); go.classList.toggle('glow', ok); }

/* ===================== Positioning ===================== */
function place(p){ const s=players[p], el=document.getElementById('char-'+p);
  el.style.left=cx(s.c)+'%'; el.style.top=cy(s.r)+'%';
  el.style.transform=`translate(-50%,-50%) rotate(${s.dir}deg)`; }
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* 매 라운드 새 출발 위치 고르기 (목적지 칸 제외, 두 말판은 서로 다른 칸) */
function facing(cell){
  const dirs=[];
  if(cell.r>0) dirs.push(0);       // 위로 갈 수 있음
  if(cell.c<MAXC) dirs.push(90);   // 오른쪽
  if(cell.r<MAXR) dirs.push(180);  // 아래
  if(cell.c>0) dirs.push(270);     // 왼쪽
  return dirs[Math.floor(Math.random()*dirs.length)];
}
function pickStarts(t){
  const cells=[];
  for(let c=0;c<=MAXC;c++) for(let r=0;r<=MAXR;r++){
    if(c===t.c && r===t.r) continue;                 // 목적지에서는 출발 X
    cells.push({ c, r, d: Math.abs(c-t.c)+Math.abs(r-t.r) });  // d: 목적지까지 거리
  }
  // 목적지에서 멀리(가능하면 3칸 이상, 안 되면 2칸 이상) 떨어진 칸만 후보로
  let pool = cells.filter(x=>x.d>=3);
  if(pool.length<3) pool = cells.filter(x=>x.d>=2);
  if(pool.length<2) pool = cells.slice();            // 안전장치
  shuffle(pool);
  return { A:{...pool[0], dir:facing(pool[0])}, B:{...pool[1], dir:facing(pool[1])} };
}

/* ===================== Command parser ===================== */
function parse(words){   // 'Go straight'는 뒤에 숫자(1~3)가 있어야 움직임
  const cmds=[];
  for(let i=0;i<words.length;i++){
    if(words[i]==='Go straight'){ let steps=1, hasNum=false;
      if(i+1<words.length && !isNaN(parseInt(words[i+1]))){ steps=parseInt(words[i+1]); hasNum=true; i++;
        if(i+1<words.length && (words[i+1]==='block'||words[i+1]==='blocks')) i++; }
      if(!hasNum) continue;   // 숫자가 없으면 움직이지 않음
      cmds.push({t:'move',v:steps}); }
    else if(words[i]==='Turn left'){ cmds.push({t:'turn',v:-90}); }
    else if(words[i]==='Turn right'){ cmds.push({t:'turn',v:90}); }
  }
  return cmds;
}

/* ===================== Run path ===================== */
async function run(p){
  const s=players[p], el=document.getElementById('char-'+p);
  for(const cmd of parse(s.words)){
    if(cmd.t==='turn'){ s.dir+=cmd.v; place(p); await sleep(450); }
    else{ for(let k=0;k<cmd.v;k++){
      let nc=s.c, nr=s.r, d=((s.dir%360)+360)%360;
      if(d===0) nr--; else if(d===90) nc++; else if(d===180) nr++; else if(d===270) nc--;
      if(nc<0||nc>MAXC||nr<0||nr>MAXR){
        el.style.transform=`translate(-50%,-50%) rotate(${s.dir}deg) scale(1.25)`; await sleep(220);
        place(p); await sleep(250); break; }
      s.c=nc; s.r=nr; place(p); await sleep(450);
    } }
  }
}

/* ===================== Turn & scoring ===================== */
/* 활성화되지 않은 GO!를 눌렀을 때: 양쪽 모두 명령어를 넣고 READY를 누르라고 안내 */
function guideGo(){
  toast('스티브와 돼지 양쪽 모두 명령어를 넣고\nREADY 버튼을 눌러요!');
  ['A','B'].forEach(p=>{
    const rd=document.getElementById('ready-'+p);
    if(!players[p].ready){ rd.classList.add('nudge'); setTimeout(()=>rd.classList.remove('nudge'),2600); }
  });
}
async function playTurn(){
  if(playing) return;
  if(document.getElementById('btn-go').classList.contains('off')){ guideGo(); return; }
  playing=true; roundOver=true; renderGuide();
  const go=document.getElementById('btn-go'); go.classList.add('off'); go.classList.remove('glow');
  document.querySelectorAll('.wbtn,.ready-btn').forEach(b=>b.disabled=true);

  // 이미 도착한 플레이어는 words가 비어 있어서 그대로 목적지에 머뭅니다.
  await Promise.all([run('A'), run('B')]);

  if(practice){   // 연습 라운드: 점수 없이 도착만 확인
    playing=false;
    const ok=['A','B'].every(p=>players[p].c===target.c && players[p].r===target.r);
    if(ok){
      ['A','B'].forEach(p=>{ players[p].arrived=true; const el=document.getElementById('char-'+p); el.classList.add('pop'); setTimeout(()=>el.classList.remove('pop'),600); });
      coachAll(); setTimeout(practiceDone,1500);
    } else {
      toast('앞, 도착하지 못했어요!\n다시 해 봐요 💪');
      setTimeout(()=>{ startRound(); coachAll(); },1800);
    }
    return;
  }

  // 이번 시도에서 새로 도착한 플레이어만 점수 +1 (라운드당 1점)
  const newly = { A:false, B:false };
  ['A','B'].forEach(p=>{
    if(!players[p].arrived && score(p)){ players[p].arrived=true; players[p].score++; newly[p]=true; }
  });
  document.getElementById('score-A').textContent=players.A.score+' / '+TOTAL;
  document.getElementById('score-B').textContent=players.B.score+' / '+TOTAL;

  playing=false;

  if(bothArrived()){
    // ✅ 두 명 모두 도착 → 그때서야 Next(또는 최종 결과) 가능
    toast('🎉 둘 다 도착!\nGreat job!');
    if(round>=TOTAL){
      const used=(HINT_MAX*2)-players.A.hintsLeft-players.B.hintsLeft;
      setTimeout(()=>toast('🏆 모든 문제를 풀었어요!\n힌트 사용: '+used+'번'), 1700);
      setTimeout(()=>showOverlay({ title:'🏆 모든 문제를 풀었어요!',
        body:'정말 잘했어요! 👏<br>힌트 사용: <b>'+used+'번</b>',
        buttons:[ { label:'🔁 다시 하기', fn:()=>{ hideOverlay(); newGame(); } } ] }),3400);
    } else {
      const next=document.getElementById('btn-next');
      next.disabled=false; next.style.display='block'; next.classList.add('blink');
    }
    return;
  }

  // ❌ 아직 한 명 이상 도착하지 못함 → Next 잠금, 못 도착한 플레이어만 다시 도전
  let msg;
  if(players.A.arrived && !players.B.arrived)      msg='스티브 도착!\n돼지는 다시 도전!\nTry again!';
  else if(players.B.arrived && !players.A.arrived) msg='돼지 도착!\n스티브는 다시 도전!\nTry again!';
  else                                             msg='아직 도착하지 못했어요!\n다시 도전 ✨\nTry again!';
  toast(msg);
  setTimeout(retryRound, 1800);
}

/* 도착 못 한 플레이어를 출발 위치로 되돌리고 다시 입력받기 */
function retryRound(){
  roundOver=false; playing=false;
  ['A','B'].forEach(p=>{
    const s=players[p];
    if(s.arrived){
      // 도착한 플레이어는 목적지에 그대로, 입력 잠금
      s.words=[]; s.ready=true; renderSentence(p); updateHintBtn(p);
      document.getElementById('ready-'+p).classList.add('on');
      setRailEnabled(p,false);
    } else {
      s.c=s.home.c; s.r=s.home.r; s.dir=s.home.dir;
      s.words=[]; s.ready=false; renderSentence(p); place(p);
      document.getElementById('ready-'+p).classList.remove('on');
      setRailEnabled(p,true);
    }
  });
  refreshGo();
}

function score(p){ const s=players[p], win=(s.c===target.c && s.r===target.r);
  if(win){ const el=document.getElementById('char-'+p); el.classList.add('pop'); setTimeout(()=>el.classList.remove('pop'),600); beep(true); }
  return win; }

/* ===================== Round flow ===================== */
function startRound(){
  playing=false; roundOver=false;
  document.getElementById('round-badge').textContent = practice ? '연습 🎓' : 'Q '+round+' / '+TOTAL;
  const next=document.getElementById('btn-next');
  next.style.display='none'; next.classList.remove('blink'); next.disabled=true;   // 도착 전에는 Next 잠금
  document.querySelectorAll('.wbtn,.ready-btn').forEach(b=>b.disabled=false);

  const t = practice ? buildings.find(b=>b.id===PRACTICE.target) : (queue[round-1] || buildings[(round-1) % buildings.length]);
  target=t;
  const starts = practice ? { A:{...PRACTICE.A.start}, B:{...PRACTICE.B.start} } : pickStarts(t);
  ['A','B'].forEach(p=>{ const s=players[p], st=starts[p];
    s.c=st.c; s.r=st.r; s.dir=st.dir;
    s.home={ c:st.c, r:st.r, dir:st.dir };
    s.arrived=false; stopHint(p);   // 힌트 내용만 지움 (남은 횟수는 게임 전체에서 유지)
    s.words=[]; s.ready=false; renderSentence(p); place(p);
    document.getElementById('ready-'+p).classList.remove('on'); });

  buildings.forEach(b=>document.getElementById('bld-'+b.id).classList.toggle('is-target', b.id===t.id));
  const pin=document.getElementById('pin'); pin.style.left=cx(t.c)+'%'; pin.style.top=cy(t.r)+'%'; pin.style.display='block';

  document.getElementById('b-name').textContent=t.name;
  document.getElementById('b-kr').textContent=t.name;
  toast('Where is the '+t.name+'?');
  speakCurrent();
  refreshGo();
}
function nextRound(){
  if(!bothArrived() || playing) return;   // 두 명 모두 도착해야만 다음 문제로
  round++; startRound();
}
function newGame(){ endPracticeUI(); round=1; players.A.score=0; players.B.score=0;
  players.A.hintsLeft=HINT_MAX; players.B.hintsLeft=HINT_MAX;
  queue = shuffle(buildings.slice());
  document.getElementById('score-A').textContent='0 / '+TOTAL;
  document.getElementById('score-B').textContent='0 / '+TOTAL;
  
  target=null; startRound(); }

/* ===================== Toast & sound ===================== */
let toastTimer;
function toast(text){ const t=document.getElementById('toast'); t.textContent=text; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2400); }
function beep(ok){ return; try{ const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
  const ctx=new C(); const notes=ok?[660,880]:[200];
  notes.forEach((f,i)=>{ const o=ctx.createOscillator(),g=ctx.createGain(); o.connect(g); g.connect(ctx.destination);
    o.type='sine'; o.frequency.value=f; const t0=ctx.currentTime+i*0.14; g.gain.setValueAtTime(.18,t0);
    g.gain.exponentialRampToValueAtTime(.001,t0+.28); o.start(t0); o.stop(t0+.28); }); }catch(e){} }

/* ===================== Speech (원어민 음성으로 질문 읽어주기) ===================== */
let enVoice=null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs=window.speechSynthesis.getVoices()||[]; if(!vs.length) return;
  const has=n=>vs.find(v=>v.name.toLowerCase().includes(n));
  enVoice =
    has('google us english') || has('google uk english') ||
    vs.find(v=>/natural/i.test(v.name) && /^en/i.test(v.lang)) ||   // Microsoft Natural 계열
    has('samantha') || has('aria') || has('jenny') || has('karen') || has('daniel') || has('alex') ||
    vs.find(v=>/en[-_]US/i.test(v.lang) && !/^Microsoft.*Desktop/i.test(v.name)) ||
    vs.find(v=>/^en/i.test(v.lang)) || null;
}
if('speechSynthesis' in window){ pickVoice(); window.speechSynthesis.onvoiceschanged=pickVoice; }

function speak(text){
  return;   // 소리 끈
  try{
    if(!('speechSynthesis' in window)) return;
    if(!enVoice) pickVoice();
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    if(enVoice){ u.voice=enVoice; u.lang=enVoice.lang; } else { u.lang='en-US'; }
    u.rate=0.9; u.pitch=1.0;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function speakCurrent(){ if(target) speak('Where is the '+target.name+'?'); }

function coachUpdate(p){
  if(!practice) return;
  const box=document.getElementById('coach-'+p), st=PRACTICE[p].steps, s=players[p], i=s.words.length, n=st.length;
  const other=players[p==='A'?'B':'A'], rd=document.getElementById('ready-'+p);
  clearNudges(p); rd.classList.remove('nudge');
  let html;
  if(s.arrived){ html='🎉 <b>도착했어요!</b>'; }
  else if(playing){ html='🚶 가는 중이에요… 지도를 봐요!'; }
  else if(i<n){
    const x=st[i], k=WORD_KO[x.w];
    html=`<span class="step">${i+1}단계 / ${n}</span><br>👉 ${k.col} <b>'${x.w}'</b> 버튼을 눌러요!<br>뜻: ${k.mean}<br>💬 ${x.note}`;
    [...document.querySelectorAll(`#rail-${p} .wbtn`)].filter(b=>b.textContent.trim()===x.w).forEach(b=>b.classList.add('nudge'));
  }
  else if(!s.ready){ html='👏 <b>잘했어요!</b><br>👉 이제 초록 <b>READY</b> 버튼을 눌러요!'; rd.classList.add('nudge'); }
  else if(!other.ready){ html='⏳ 반대쪽도 READY를 눌러요…'; }
  else { html='🔴 빨간 <b>GO!</b> 버튼을 눌러요!'; }
  box.innerHTML=html; box.style.display='block';
}
function coachAll(){ coachUpdate('A'); coachUpdate('B'); }
function practiceWrong(p){
